<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Novarise World - AQW Style Character Customizer</title>
<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
}
body {
    background: #0a0d14;
    color: #fff;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 20px;
}
header {
    text-align: center;
    margin-bottom: 20px;
}
header h1 {
    font-size: 28px;
    color: #facc15;
    text-shadow: 0 0 10px rgba(250, 204, 21, 0.4);
}
header p {
    color: #9ca3af;
    font-size: 14px;
}
.container {
    display: flex;
    flex-wrap: wrap;
    gap: 20px;
    max-width: 900px;
    width: 100%;
    background: #111827;
    border: 2px solid #374151;
    border-radius: 16px;
    padding: 20px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.8);
}
.stage {
    flex: 1;
    min-width: 300px;
    height: 450px;
    background: radial-gradient(circle at center bottom, #1f2937 0%, #030712 80%);
    border: 1px solid #4b5563;
    border-radius: 12px;
    display: flex;
    justify-content: center;
    align-items: center;
    position: relative;
    overflow: hidden;
}
.character-wrapper {
    position: relative;
    width: 180px;
    height: 280px;
}
.aqw-svg {
    width: 100%;
    height: 100%;
    filter: drop-shadow(0 10px 8px rgba(0,0,0,0.8));
    animation: aqwIdle 2s ease-in-out infinite alternate;
}
@keyframes aqwIdle {
    0% { transform: translateY(0); }
    100% { transform: translateY(-3px); }
}
.controls {
    flex: 1;
    min-width: 280px;
    display: flex;
    flex-direction: column;
    gap: 15px;
}
.panel {
    background: #1f2937;
    border: 1px solid #374151;
    border-radius: 8px;
    padding: 15px;
}
.panel h2 {
    font-size: 16px;
    color: #e5e7eb;
    margin-bottom: 10px;
    border-bottom: 1px solid #374151;
    padding-bottom: 5px;
}
.option-group {
    display: flex;
    flex-direction: column;
    gap: 8px;
    margin-bottom: 12px;
}
label {
    font-size: 12px;
    color: #9ca3af;
}
input[type="color"] {
    -webkit-appearance: none;
    border: none;
    width: 100%;
    height: 35px;
    border-radius: 6px;
    cursor: pointer;
    background: transparent;
}
.btn-group {
    display: flex;
    gap: 10px;
    margin-top: 10px;
}
button {
    flex: 1;
    padding: 10px;
    background: #2563eb;
    color: #fff;
    border: none;
    border-radius: 6px;
    font-weight: bold;
    cursor: pointer;
    transition: background 0.2s;
}
button:hover { background: #1d4ed8; }
.back-btn { background: #374151; }
.back-btn:hover { background: #4b5563; }
</style>
</head>
<body>

<header>
    <h1>🛡️ AQW-Style Character Studio</h1>
    <p>I-customize ang hitsura, suot, at kulay ng iyong AQW-inspired avatar</p>
</header>

<div class="container">
    <div class="stage">
        <div class="character-wrapper">
            <!-- AQW Style Vector Character (Side Stance + Staff/Weapon) -->
            <svg class="aqw-svg" viewBox="0 0 120 180" xmlns="http://www.w3.org/2000/svg">
                <!-- Shadow -->
                <ellipse cx="60" cy="172" rx="35" ry="6" fill="rgba(0,0,0,0.6)" />

                <!-- Long Weapon / Staff (Hawak sa harap ala AQW) -->
                <line x1="15" y1="150" x2="105" y2="95" stroke="#b45309" stroke-width="5" stroke-linecap="round" />
                <line x1="15" y1="150" x2="105" y2="95" stroke="#fde047" stroke-width="2" />
                <!-- Staff Crystal Tip -->
                <circle cx="105" cy="95" r="9" fill="#0284c7" />
                <circle cx="105" cy="95" r="5" fill="#38bdf8" />

                <!-- Left Leg (Background / Darkened) -->
                <path d="M 50 115 L 48 165 L 58 165 L 56 115 Z" fill="#1e293b" />
                <path d="M 48 150 L 58 150 L 58 168 L 48 168 Z" fill="#0f172a" />

                <!-- Torso / Armor (AQW Dress/Robe style) -->
                <path d="M 42 65 Q 60 60 78 65 L 75 120 Q 60 125 45 120 Z" fill="#c084fc" id="armorColor" />
                <!-- Belt / Trims -->
                <path d="M 44 110 Q 60 116 76 110" stroke="#cbd5e1" stroke-width="4" fill="none" />
                <circle cx="60" cy="113" r="4" fill="#f59e0b" />

                <!-- Right Leg (Foreground) -->
                <path d="M 62 115 L 65 165 L 75 165 L 70 115 Z" fill="#334155" />
                <path d="M 64 150 L 74 150 L 74 168 L 64 168 Z" fill="#ffffff" /> <!-- White Boot ala reference -->

                <!-- Left Arm & Hand (Behind Staff) -->
                <path d="M 44 68 L 32 105" stroke="#c084fc" stroke-width="8" stroke-linecap="round" />
                <circle cx="30" cy="108" r="4" fill="#cbd5e1" /> <!-- Hand -->

                <!-- Head / Face (AQW anime sharp style) -->
                <path d="M 50 35 L 70 35 L 68 62 L 52 62 Z" fill="#fbcfe8" /> <!-- Neck -->
                <ellipse cx="60" cy="28" rx="16" ry="18" fill="#fbcfe8" id="skinColor" />
                
                <!-- Hair (Long side bangs ala reference) -->
                <path d="M 44 20 Q 60 10 76 20 L 72 55 Q 60 30 48 55 Z" fill="#991b1b" id="hairColor" />
                <!-- Eyes / Expression -->
                <polygon points="53,26 59,24 57,30" fill="#111" />
                <polygon points="67,26 61,24 63,30" fill="#111" />

                <!-- Helmet / Horns (Monster Helm ala AQW) -->
                <path d="M 45 22 Q 60 8 75 22 L 70 32 Q 60 25 50 32 Z" fill="#7f1d1d" id="helmColor" />
                <!-- Left Horn -->
                <path d="M 48 18 Q 32 5 22 18 Q 35 25 46 22 Z" fill="#334155" />
                <path d="M 45 15 Q 35 8 28 15" stroke="#1e293b" stroke-width="2" fill="none" />
                <!-- Right Horn -->
                <path d="M 72 18 Q 88 5 98 18 Q 85 25 74 22 Z" fill="#334155" />
                <path d="M 75 15 Q 85 8 92 15" stroke="#1e293b" stroke-width="2" fill="none" />

                <!-- Right Arm & Hand (Foreground holding staff) -->
                <path d="M 74 68 L 95 110" stroke="#c084fc" stroke-width="9" stroke-linecap="round" />
                <circle cx="97" cy="113" r="5" fill="#111" /> <!-- Gloved hand ala reference -->
            </svg>
        </div>
    </div>

    <div class="controls">
        <div class="panel">
            <h2>🎨 AQW Armor & Theme Customizer</h2>
            
            <div class="option-group">
                <label>Armor / Robe Color</label>
                <input type="color" id="armorPicker" value="#c084fc">
            </div>

            <div class="option-group">
                <label>Helmet & Horns Color</label>
                <input type="color" id="helmPicker" value="#7f1d1d">
            </div>

            <div class="option-group">
                <label>Hair Color</label>
                <input type="color" id="hairPicker" value="#991b1b">
            </div>
        </div>

        <div class="btn-group">
            <button onclick="window.location.href='index.html'" class="back-btn">⬅️ Bumalik sa Laro</button>
            <button onclick="alert('Na-save ang AQW Avatar Customization!')">💾 Save Avatar</button>
        </div>
    </div>
</div>

<script>
document.getElementById('armorPicker').addEventListener('input', (e) => {
    document.getElementById('armorColor').setAttribute('fill', e.target.value);
});
document.getElementById('helmPicker').addEventListener('input', (e) => {
    document.getElementById('helmColor').setAttribute('fill', e.target.value);
});
document.getElementById('hairPicker').addEventListener('input', (e) => {
    document.getElementById('hairColor').setAttribute('fill', e.target.value);
});
</script>

</body>
</html>
