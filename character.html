<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Novarise World - Character Studio</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
body { background: #0a0d14; color: #fff; min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 20px; }
header { text-align: center; margin-bottom: 20px; }
header h1 { font-size: 28px; color: #facc15; }
.container { display: flex; flex-wrap: wrap; gap: 20px; max-width: 850px; width: 100%; background: #111827; border: 2px solid #374151; border-radius: 16px; padding: 20px; }
.stage { flex: 1; min-width: 280px; height: 380px; background: radial-gradient(circle at center bottom, #1f2937 0%, #030712 80%); border-radius: 12px; display: flex; justify-content: center; align-items: center; }
.character-wrapper { width: 220px; height: 320px; }
.aqw-avatar { width: 100%; height: 100%; }
.controls { flex: 1; min-width: 260px; display: flex; flex-direction: column; gap: 15px; }
.panel { background: #1f2937; border-radius: 8px; padding: 15px; }
.option-group { display: flex; flex-direction: column; gap: 8px; margin-bottom: 12px; }
input[type="color"] { -webkit-appearance: none; border: none; width: 100%; height: 35px; border-radius: 6px; cursor: pointer; background: transparent; }
button { padding: 12px; background: #2563eb; color: #fff; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; }
button:hover { background: #1d4ed8; }
</style>
</head>
<body>

<header>
    <h1>🛡️ AQW Character Customizer</h1>
</header>

<div class="container">
    <div class="stage">
        <div class="character-wrapper">

  <ellipse cx="60" cy="172" rx="34" ry="5" fill="rgba(0,0,0,.48)"/>
  <!-- flowing dark cape -->
  <path id="capeColor" d="M42 47 L24 94 L17 145 Q37 157 66 151 L79 104 L73 49Z" fill="#292f3b" stroke="#090d14" stroke-width="3" stroke-linejoin="round"/>
  <path d="M30 89 L22 139 L37 147 L45 99Z" fill="#424957" stroke="#111827" stroke-width="2"/>
  <!-- back leg -->
  <g class="leg-right">
    <path d="M62 105 L79 109 L76 143 L69 160 L55 158 L62 135Z" fill="#46382d" stroke="#111" stroke-width="3" stroke-linejoin="round"/>
    <path d="M59 151 L76 148 L82 164 L72 171 L55 166Z" fill="#39465a" stroke="#10151d" stroke-width="3"/>
    <path d="M60 157 L76 155 M60 163 L79 161" stroke="#8290a3" stroke-width="3"/>
  </g>
  <!-- front leg and plated greave -->
  <g class="leg-left">
    <path d="M43 105 L61 108 L56 140 L47 157 L34 153 L39 128Z" fill="#49392d" stroke="#111" stroke-width="3"/>

    <path d="M31 151 L49 146 L44 160 L31 163Z" fill="#8493a8" stroke="#263244" stroke-width="2"/>
    <path d="M28 163 L43 160 L48 171 Q38 177 24 171Z" fill="#3d4c60" stroke="#10151d" stroke-width="3"/>
    <path d="M27 168 L43 166" stroke="#a7b4c4" stroke-width="2"/>
  </g>
  <!-- leather belt and pouches behind chest -->
  <path d="M40 91 L76 88 L81 103 L39 111Z" fill="#493528" stroke="#17120f" stroke-width="3"/>
  <path d="M44 98 L77 95" stroke="#b38a54" stroke-width="3"/>
  <rect x="68" y="94" width="13" height="19" rx="2" fill="#68472d" stroke="#21180f" stroke-width="2"/>
  <rect x="70" y="97" width="8" height="8" rx="1" fill="#9a774a"/>
  <!-- torso under-armor -->
  <path d="M41 47 Q57 39 75 49 L81 92 Q62 104 38 94Z" fill="#303b4b" stroke="#111720" stroke-width="3" stroke-linejoin="round"/>
  <!-- steel chest plate -->
  <path id="armorColor" d="M43 49 Q59 42 74 50 L77 83 Q68 94 47 91 L39 69Z" fill="#66768b" stroke="#18212d" stroke-width="3" stroke-linejoin="round"/>
  <path d="M44 53 L58 61 L72 54 L74 80 Q62 87 48 83Z" fill="#8797aa" stroke="#344253" stroke-width="2"/>
  <path d="M46 56 L58 63 L70 57" fill="none" stroke="#c3ceda" stroke-width="2"/>
  <path d="M47 84 L72 83" stroke="#3d4b5d" stroke-width="4"/>
  <!-- far arm -->
  <g class="arm-right">
    <path d="M71 52 L84 68 L87 89 L77 94 L68 72Z" fill="#4b5667" stroke="#121821" stroke-width="3"/>
    <path d="M76 82 L89 81 L94 94 L82 100 L74 92Z" fill="#596a80" stroke="#10151d" stroke-width="3"/>
  </g>
  <!-- large spiked shoulder pauldron -->
  <path d="M43 49 Q28 39 19 51 L12 72 L20 91 L43 94 L55 75Z" fill="#47566b" stroke="#111923" stroke-width="4" stroke-linejoin="round"/>

  <path d="M19 54 L12 35 Q10 24 17 15 L25 40 L30 50Z" fill="#56677f" stroke="#121b28" stroke-width="3" stroke-linejoin="round"/>
  <path d="M20 61 L30 56 L39 63 L36 76 L25 79Z" fill="#9aa8ba" stroke="#334155" stroke-width="2"/>
  <path d="M20 72 L29 69 L35 77 L30 86 L21 83Z" fill="#7d8da2" stroke="#334155" stroke-width="2"/>
  <path d="M15 80 L24 79 L29 87 L21 93Z" fill="#64758b" stroke="#263244" stroke-width="2"/>
  <!-- front arm with armored bracer -->
  <g class="arm-left">
    <path d="M39 54 L30 76 L34 96 L45 98 L49 88 L45 72 L50 60Z" fill="#4a382c" stroke="#111" stroke-width="3"/>
    <path d="M31 83 L44 79 L50 91 L46 107 L32 109 L26 97Z" fill="#596b82" stroke="#111923" stroke-width="3"/>
    <path d="M30 91 L43 87 L45 97 L33 102Z" fill="#91a0b4" stroke="#354357" stroke-width="2"/>
    <path d="M31 104 L45 101 L49 110 L38 116 L29 111Z" fill="#39475b" stroke="#10151d" stroke-width="3"/>
  </g>
  <!-- neck and face -->
  <path d="M51 38 L68 38 L68 51 L53 53Z" fill="#b97842" stroke="#2a1b14" stroke-width="2"/>
  <path d="M44 20 Q48 8 62 10 Q77 11 79 27 L74 42 L66 49 L52 44 L43 34Z" fill="#efc18a" stroke="#39271b" stroke-width="2.5"/>
  <path d="M45 26 Q54 19 62 25" fill="none" stroke="#fff0cf" stroke-width="2"/>
  <path d="M48 29 Q55 26 59 30 L57 36 L49 35Z" fill="#f7fafc" stroke="#1c2734" stroke-width="1.5"/>
  <ellipse cx="54" cy="32" rx="2.3" ry="3.2" fill="#1596c7"/>
  <circle cx="54" cy="32" r="1.2" fill="#101827"/>
  <path d="M65 29 Q71 26 75 30 L73 35 L66 35Z" fill="#f7fafc" stroke="#1c2734" stroke-width="1.5"/>
  <ellipse cx="70" cy="32" rx="2.1" ry="3" fill="#1596c7"/>
  <circle cx="70" cy="32" r="1.1" fill="#101827"/>
  <path d="M47 26 L58 24 M64 24 L76 25" stroke="#51331f" stroke-width="3" stroke-linecap="round"/>
  <path d="M65 38 L72 38" stroke="#8c4d32" stroke-width="1.5" stroke-linecap="round"/>
  <!-- swept spiky brown hair -->
  <path id="hairColor" d="M43 27 Q37 16 48 9 L40 7 Q52 -1 63 5 L76 1 L70 10 L88 6 L77 18 L84 19 L72 25 L63 22 L53 29Z" fill="#65401f" stroke="#21160f" stroke-width="3" stroke-linejoin="round"/>
  <path d="M45 17 Q55 7 68 7 L59 14 L75 11 L65 20 L53 23Z" fill="#95612e"/>
  <!-- sword arm and warrior sword -->
  <g class="sword-arm">
    <path d="M73 57 L84 70 L86 88 L76 93 L68 76Z" fill="#65768d" stroke="#111923" stroke-width="3"/>
    <path d="M79 84 L91 82 L96 92 L87 100 L78 94Z" fill="#4a5a70" stroke="#111923" stroke-width="3"/>
    <g class="warrior-sword">
      <path d="M88 92 L104 42 L111 39 L103 94 L96 101Z" fill="#c7d3df" stroke="#18212d" stroke-width="2.5" stroke-linejoin="round"/>
      <path d="M101 47 L105 43 L98 91 L95 94Z" fill="#f4f7fb"/>

      <path d="M84 88 L79 99" stroke="#c7a05a" stroke-width="4" stroke-linecap="round"/>
      <circle cx="80" cy="101" r="4" fill="#d7b36a" stroke="#3a2b19" stroke-width="1.5"/>
    </g>
  </g>
</svg>
        </div>
    </div>

    <div class="controls">
        <div class="panel">
            <div class="option-group">
                <label>Armor Color</label>
                <input type="color" id="armorPicker" value="#66768b">
            </div>
            <div class="option-group">
                <label>Hair Color</label>
                <input type="color" id="hairPicker" value="#65401f">
            </div>
            <div class="option-group">
                <label>Cape Color</label>
                <input type="color" id="capePicker" value="#292f3b">
            </div>
        </div>
        <button onclick="window.location.href='index.html'">⬅️ Save & Return to Game</button>
    </div>
</div>

<script>
const colorSettings = [
  ['armorPicker', 'armorColor', 'nvrArmor'],
  ['hairPicker', 'hairColor', 'nvrHair'],
  ['capePicker', 'capeColor', 'nvrCape']
];
colorSettings.forEach(([pickerId, shapeId, storageKey]) => {
  const picker = document.getElementById(pickerId);
  const shape = document.getElementById(shapeId);
  const saved = localStorage.getItem(storageKey);
  if (saved) { picker.value = saved; shape.setAttribute('fill', saved); }
  picker.addEventListener('input', (e) => {
    shape.setAttribute('fill', e.target.value);
    localStorage.setItem(storageKey, e.target.value);
  });
});
</script>

</body>
</html>
