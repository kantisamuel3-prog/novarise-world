<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Novarise World - Character Studio</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
body { background: #0a0d14; color: #fff; min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 20px; }
header { text-align: center; margin-bottom: 20px; }
header h1 { font-size: 28px; color: #facc15; }
.container { display: flex; flex-wrap: wrap; gap: 20px; max-width: 850px; width: 100%; background: #111827; border: 2px solid #374151; border-radius: 16px; padding: 20px; }
.stage { flex: 1; min-width: 280px; height: 380px; background: radial-gradient(circle at center bottom, #1f2937 0%, #030712 80%); border-radius: 12px; display: flex; justify-content: center; align-items: center; }
.character-wrapper { width: 220px; height: 440px; display:flex; align-items:flex-end; justify-content:center; }
.warrior-reference { width:100%; height:100%; object-fit:contain; object-position:center bottom; }
.aqw-avatar { width: 100%; height: 100%; }
.controls { flex: 1; min-width: 260px; display: flex; flex-direction: column; gap: 15px; }
.panel { background: #1f2937; border-radius: 8px; padding: 15px; }
.option-group { display: flex; flex-direction: column; gap: 8px; margin-bottom: 12px; }
input[type="color"] { -webkit-appearance: none; border: none; width: 100%; height: 35px; border-radius: 6px; cursor: pointer; background: transparent; }
button { padding: 12px; background: #2563eb; color: #fff; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; }
button:hover { background: #1d4ed8; }
</style>
</head>
<body>

<header>
    <h1>🛡️ AQW Character Customizer</h1>
</header>

<div class="container">
    <div class="stage">
        <div class="character-wrapper">
            <img class="warrior-reference" src="warrior-reference.png" alt="Original armored warrior reference artwork">
        </div>
    </div>

    <div class="controls">
        <div class="panel">
            <h3 style="color:#facc15;margin-bottom:10px;">Original Warrior Artwork</h3>
            <p style="color:#cbd5e1;font-size:14px;line-height:1.5;">Ginagamit dito ang mismong warrior image na ibinigay mo para tumugma ang character preview sa game.</p>
        </div>
        <button onclick="window.location.href='index.html'">⬅️ Save & Return to Game</button>
    </div>
</div>

<script>
/* The supplied warrior artwork is preserved as-is so the preview matches the game. */
</script>
</body>
</html>
