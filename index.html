<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>My Fantasy MMORPG</title>

<style>
* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
    font-family: Arial, sans-serif;
}

#game {
    position: relative;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    background:
        linear-gradient(rgba(20,35,15,.15), rgba(0,0,0,.2)),
        linear-gradient(#456b28 0%, #233919 35%, #172116 100%);
}

/* =========================
   FOREST
========================= */

.tree {
    position: absolute;
    bottom: 65px;
    width: 110px;
    height: 470px;
    background: linear-gradient(
        90deg,
        #2b241c,
        #66513a,
        #3a2e22
    );
    border-radius: 45px 45px 15px 15px;
    box-shadow: inset 12px 0 0 rgba(0,0,0,.25);
}

.tree::before {
    content: "";
    position: absolute;
    width: 230px;
    height: 170px;
    left: -60px;
    top: -80px;
    border-radius: 50%;
    background: #527a29;
    box-shadow:
        70px -35px 0 #638b30,
        145px 5px 0 #456d25,
        30px 45px 0 #3d6222;
}

.tree::after {
    content: "";
    position: absolute;
    width: 170px;
    height: 120px;
    left: -30px;
    top: -120px;
    border-radius: 50%;
    background: #6c9135;
}

.tree1 { left: 30px; transform: scale(1.1); }
.tree2 { left: 250px; transform: scale(.85); }
.tree3 { left: 450px; transform: scale(1.25); }
.tree4 { right: 450px; transform: scale(1.15); }
.tree5 { right: 220px; transform: scale(.9); }
.tree6 { right: 20px; transform: scale(1.1); }

/* =========================
   DARK FOREST BACKGROUND
========================= */

.forest-dark {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 48%;
    background:
        radial-gradient(circle at 50% 90%,
        #111811 0%,
        #091009 55%,
        #050805 100%);
    z-index: 0;
}

/* =========================
   PATH
========================= */

.path {
    position: absolute;
    width: 52%;
    height: 75%;
    left: 24%;
    bottom: 55px;

    background:
        linear-gradient(
            90deg,
            #735738,
            #a37e50,
            #8d6b43
        );

    clip-path: polygon(
        42% 0,
        58% 0,
        100% 100%,
        0 100%
    );

    box-shadow: 0 0 20px rgba(0,0,0,.4);
}

/* =========================
   GRASS
========================= */

.grass {
    position: absolute;
    bottom: 60px;
    width: 100%;
    height: 42%;
    background:
        radial-gradient(circle at 20% 40%, #668d29 0 5px, transparent 6px),
        radial-gradient(circle at 75% 30%, #7da332 0 5px, transparent 6px),
        radial-gradient(circle at 40% 70%, #557c25 0 4px, transparent 5px);
}

/* =========================
   NPC
========================= */

.npc {
    position: absolute;
    left: 12%;
    bottom: 125px;
    width: 100px;
    height: 220px;
    z-index: 5;
}

.npc-head {
    position: absolute;
    top: 0;
    left: 28px;
    width: 45px;
    height: 55px;
    border-radius: 50%;
    background: #151515;
    box-shadow: 0 -12px 0 #0a0a0a;
}

.npc-body {
    position: absolute;
    top: 45px;
    left: 10px;
    width: 80px;
    height: 160px;
    background:
        linear-gradient(
            90deg,
            #0b0b0b,
            #292929,
            #101010
        );

    clip-path: polygon(
        35% 0,
        65% 0,
        80% 25%,
        100% 100%,
        0 100%,
        20% 25%
    );
}

.quest {
    position: absolute;
    top: -75px;
    left: 28px;

    width: 45px;
    height: 45px;

    border-radius: 50%;
    background: #e51c23;
    border: 3px solid #ffd800;

    color: white;
    text-align: center;
    line-height: 40px;
    font-size: 30px;
    font-weight: bold;

    box-shadow: 0 3px 8px #000;
}

/* =========================
   PLAYER
========================= */

.player {
    position: absolute;

    left: 56%;
    bottom: 105px;

    width: 150px;
    height: 260px;

    z-index: 8;
}

/* shadow */

.player-shadow {
    position: absolute;
    bottom: 0;
    left: 25px;

    width: 105px;
    height: 22px;

    background: rgba(0,0,0,.55);
    border-radius: 50%;
}

/* cape */

.cape {
    position: absolute;

    left: 22px;
    top: 75px;

    width: 105px;
    height: 150px;

    background:
        linear-gradient(
            90deg,
            #07090d,
            #1c1f25,
            #050609
        );

    clip-path: polygon(
        35% 0,
        75% 0,
        100% 100%,
        5% 100%
    );
}

/* body */

.body {
    position: absolute;

    left: 48px;
    top: 75px;

    width: 58px;
    height: 105px;

    background:
        linear-gradient(
            90deg,
            #16191e,
            #34373c,
            #101216
        );

    border-radius: 12px;
}

/* head */

.head {
    position: absolute;

    left: 48px;
    top: 18px;

    width: 62px;
    height: 68px;

    border-radius: 45%;

    background: #c39576;

    z-index: 3;
}

/* anime/AQW-style hair */

.hair {
    position: absolute;

    left: 38px;
    top: 5px;

    width: 82px;
    height: 115px;

    background: #e8e1cd;

    border-radius:
        55% 45% 35% 60%;

    z-index: 4;

    transform: rotate(-8deg);

    box-shadow:
        -18px 32px 0 #eee8d6,
        35px 15px 0 #ddd6c2;
}

.hair::after {
    content: "";

    position: absolute;

    width: 50px;
    height: 35px;

    left: 10px;
    top: -5px;

    background: #111;

    border-radius: 50%;
}

/* face */

.face {
    position: absolute;

    left: 54px;
    top: 45px;

    width: 50px;
    height: 55px;

    z-index: 5;
}

.eye {
    position: absolute;

    width: 6px;
    height: 6px;

    background: #111;

    border-radius: 50%;

    top: 22px;
}

.eye1 { left: 9px; }
.eye2 { right: 8px; }

/* armor */

.armor {
    position: absolute;

    left: 42px;
    top: 78px;

    width: 75px;
    height: 100px;

    z-index: 6;

    background:
        linear-gradient(
            90deg,
            #101318,
            #44484d,
            #121419
        );

    clip-path: polygon(
        20% 0,
        80% 0,
        100% 100%,
        0 100%
    );

    border-bottom: 3px solid #8a713b;
}

/* legs */

.leg {
    position: absolute;

    top: 165px;

    width: 25px;
    height: 80px;

    background: #0d1014;

    z-index: 5;
}

.leg1 { left: 48px; }
.leg2 { left: 83px; }

/* sword */

.sword {
    position: absolute;

    left: 105px;
    top: 85px;

    width: 12px;
    height: 135px;

    background:
        linear-gradient(
            90deg,
            #777,
            #eee,
            #777
        );

    transform: rotate(-32deg);

    z-index: 10;

    box-shadow: 0 0 4px #fff;
}

.sword::after {
    content: "";

    position: absolute;

    width: 45px;
    height: 7px;

    background: #a87d32;

    top: 85px;
    left: -15px;
}

/* =========================
   TOP PLAYER HUD
========================= */

#playerHud {
    position: absolute;

    top: 10px;
    left: 10px;

    width: 280px;

    z-index: 20;

    display: flex;
    gap: 8px;
}

.avatar {
    width: 75px;
    height: 80px;

    background:
        linear-gradient(#777,#222);

    border: 2px solid #111;
    border-radius: 5px;

    position: relative;

    overflow: hidden;
}

.avatar::before {
    content: "";

    position: absolute;

    width: 45px;
    height: 65px;

    left: 15px;
    top: 7px;

    background: #e8e0cc;

    border-radius: 50%;
}

.avatar::after {
    content: "";

    position: absolute;

    width: 50px;
    height: 22px;

    left: 13px;
    top: 7px;

    background: #111;

    border-radius: 50%;
}

.stats {
    flex: 1;
}

.username {
    font-weight: bold;
    font-size: 13px;
    margin-bottom: 3px;
}

.hp,
.mp {
    width: 100%;
    height: 21px;

    background: #111;

    border: 2px solid #111;

    border-radius: 12px;

    overflow: hidden;

    margin-bottom: 2px;
}

.hp-fill {
    width: 88%;
    height: 100%;

    background:
        linear-gradient(#ff4d4d,#b40000);

    text-align: center;

    line-height: 17px;

    font-size: 11px;
    font-weight: bold;
}

.mp-fill {
    width: 64%;
    height: 100%;

    background:
        linear-gradient(#4f9bff,#174db9);

    text-align: center;

    line-height: 17px;

    font-size: 11px;
    font-weight: bold;
}

.level {
    font-size: 10px;
    margin-top: 4px;
}

/* =========================
   TARGET
========================= */

#target {
    position: absolute;

    top: 130px;
    left: 8px;

    width: 150px;

    padding: 6px 8px;

    background: rgba(0,0,0,.78);

    border-radius: 5px;

    z-index: 20;
}

.target-name {
    font-size: 14px;
}

.target-status {
    color: #aaa;
    font-size: 13px;
}

/* =========================
   BOTTOM BAR
========================= */

#bottomBar {
    position: absolute;

    left: 0;
    right: 0;
    bottom: 0;

    height: 72px;

    z-index: 30;

    background:
        linear-gradient(#3b3b3b,#111);

    border-top: 2px solid #777;

    display: flex;

    align-items: center;

    gap: 5px;

    padding: 5px 8px;
}

.button {
    width: 53px;
    height: 60px;

    background:
        linear-gradient(#555,#151515);

    border: 1px solid #777;

    color: white;

    position: relative;

    cursor: pointer;

    font-size: 26px;
}

.button:hover {
    filter: brightness(1.3);
}

.number {
    position: absolute;

    bottom: 2px;
    left: 5px;

    font-size: 11px;
}

.chat {
    flex: 1;

    height: 45px;

    display: flex;
}

.chat input {
    flex: 1;

    background: #050505;

    border: 1px solid #555;

    color: white;

    padding: 0 10px;
}

.send {
    width: 60px;

    background: #dfa515;

    border: 1px solid #8d690b;

    font-weight: bold;
}

#online {
    position: absolute;

    right: 10px;
    bottom: 80px;

    z-index: 20;

    font-size: 13px;

    text-shadow: 1px 1px 3px black;
}

#message {
    position: absolute;

    left: 50%;
    top: 45%;

    transform: translate(-50%,-50%);

    z-index: 50;

    font-size: 28px;

    font-weight: bold;

    text-shadow: 2px 2px 5px #000;

    opacity: 0;
}
</style>
</head>

<body>

<div id="game">

    <div class="forest-dark"></div>

    <div class="grass"></div>

    <div class="path"></div>

    <div class="tree tree1"></div>
    <div class="tree tree2"></div>
    <div class="tree tree3"></div>
    <div class="tree tree4"></div>
    <div class="tree tree5"></div>
    <div class="tree tree6"></div>

    <!-- NPC -->

    <div class="npc">

        <div class="quest">!</div>

        <div class="npc-head"></div>

        <div class="npc-body"></div>

    </div>


    <!-- PLAYER -->

    <div class="player">

        <div class="player-shadow"></div>

        <div class="cape"></div>

        <div class="head"></div>

        <div class="hair"></div>

        <div class="face">
            <div class="eye eye1"></div>
            <div class="eye eye2"></div>
        </div>

        <div class="armor"></div>

        <div class="leg leg1"></div>
        <div class="leg leg2"></div>

        <div class="sword"></div>

    </div>


    <!-- PLAYER HUD -->

    <div id="playerHud">

        <div class="avatar"></div>

        <div class="stats">

            <div class="username">
                MR JELLYBEAN
            </div>

            <div class="hp">
                <div class="hp-fill">
                    12603
                </div>
            </div>

            <div class="mp">
                <div class="mp-fill">
                    2251
                </div>
            </div>

            <div class="level">
                Level 69 &nbsp; Alpha Pirate, Rank 10
            </div>

        </div>

    </div>


    <!-- TARGET -->

    <div id="target">

        <div class="target-name">
            Lucy
        </div>

        <div class="target-status">
            Out of range
        </div>

    </div>


    <div id="online">
        1 player in forest-92069 ▲
    </div>


    <div id="message"></div>


    <!-- BOTTOM HUD -->

    <div id="bottomBar">

        <button class="button">☰</button>

        <button class="button">💬</button>

        <div class="chat">

            <input
                id="chatInput"
                placeholder=""
                onkeydown="if(event.key==='Enter')sendChat()"
            >

            <button class="send" onclick="sendChat()">
                SEND
            </button>

        </div>


        <button class="button" onclick="attack()">
            ⚔
            <span class="number">1</span>
        </button>

        <button class="button">
            🧪
            <span class="number">2</span>
        </button>

        <button class="button">
            ⛔
            <span class="number">3</span>
        </button>

        <button class="button">
            🗡
            <span class="number">4</span>
        </button>

        <button class="button">
            ✨
            <span class="number">5</span>
        </button>

        <button class="button">
            🌑
            <span class="number">6</span>
        </button>

        <button class="button">
            🎒
        </button>

        <button class="button">
            ❤️
        </button>

        <button class="button">
            ⚔
        </button>

        <button class="button">
            ❗
        </button>

        <button class="button">
            📜
        </button>

        <button class="button">
            🏠
        </button>

        <button class="button">
            ⚙
        </button>

    </div>

</div>


<script>

function showMessage(text) {

    const message =
        document.getElementById("message");

    message.innerText = text;

    message.style.opacity = "1";

    setTimeout(() => {

        message.style.opacity = "0";

    }, 800);

}


function attack() {

    showMessage("⚔ 1,284 DAMAGE");

}


function sendChat() {

    const input =
        document.getElementById("chatInput");

    if (input.value.trim() === "")
        return;

    showMessage("💬 " + input.value);

    input.value = "";

}

</script>

</body>
</html>
