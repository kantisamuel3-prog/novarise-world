
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Novarise World - AQW Complete Edition</title>

<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;background:#111;font-family:Arial,Helvetica,sans-serif;user-select:none}
#world{position:fixed;inset:0;overflow:hidden;background:#111}
#map{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;pointer-events:none}
#gameLayer{position:absolute;inset:0;overflow:hidden}

/* PLAYER */
#player{position:absolute;left:50%;top:68%;width:112px;height:190px;transform:translate(-50%,-100%);z-index:20;pointer-events:none}
#playerFallback{position:absolute;left:50%;bottom:0;width:112px;height:190px;transform:translateX(-50%);transform-origin:50% 100%}
.warrior-art{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;object-position:center bottom;transform-origin:50% 88%;filter:drop-shadow(0 5px 4px rgba(0,0,0,.35))}
.warrior-sword-overlay{position:absolute;inset:0;width:100%;height:100%;overflow:visible;transform-origin:69% 47%;pointer-events:none}
.fallback-name{position:absolute;left:50%;top:-25px;transform:translateX(-50%);color:white;white-space:nowrap;font-size:14px;font-weight:800;text-shadow:0 2px 3px #000,0 0 5px #000;z-index:5}
#playerFallback.face-left .warrior-art{transform:scaleX(-1)}
#playerFallback.face-left .warrior-sword-overlay{transform:scaleX(-1)}
#playerFallback.running{animation:groundRun .22s infinite alternate ease-in-out}
#playerFallback.running .warrior-art{animation:torsoRun .22s infinite alternate ease-in-out}
#playerFallback.running .warrior-sword-overlay{animation:swordRun .22s infinite alternate ease-in-out}
#playerFallback.jumping{animation:wholeJump .62s cubic-bezier(.25,.7,.35,1)}
#playerFallback.jumping .warrior-art,#playerFallback.jumping .warrior-sword-overlay{animation:none}
#playerFallback.attacking .warrior-art{animation:attackBody .38s ease-out}
#playerFallback.attacking .warrior-sword-overlay{animation:swordSlash .38s ease-out}
@keyframes groundRun{from{transform:translateX(-50%) translateY(0)}to{transform:translateX(-50%) translateY(-2px)}}
@keyframes torsoRun{from{translate:0 0;rotate:-1deg}to{translate:0 -2px;rotate:1deg}}
@keyframes swordRun{from{rotate:-3deg}to{rotate:4deg}}
@keyframes wholeJump{0%,100%{transform:translateX(-50%) translateY(0)}35%,65%{transform:translateX(-50%) translateY(-34px)}}
@keyframes attackBody{0%,100%{translate:0 0;rotate:0}35%{translate:-2px 0;rotate:3deg}}
@keyframes swordSlash{0%{transform:rotate(0)}35%{transform:rotate(-38deg)}70%{transform:rotate(24deg)}100%{transform:rotate(0)}}
#aqwSwfHost{position:absolute;inset:0;display:none;z-index:4}
.aqw-swf-player{width:100%;height:100%;display:block;background:transparent}
#playerFallback.swf-mode .warrior-art,#playerFallback.swf-mode .warrior-sword-overlay{display:none}
#playerFallback.swf-mode #aqwSwfHost{display:block}

/* DAMAGE */
.damage-pop{position:absolute;color:#facc15;font-size:26px;font-weight:900;text-shadow:0 2px 4px #000,0 0 10px #ef4444;pointer-events:none;z-index:100;animation:floatDamage .8s ease-out forwards}
@keyframes floatDamage{0%{opacity:1;transform:translate(-50%,0) scale(.8)}50%{transform:translate(-50%,-40px) scale(1.2)}100%{opacity:0;transform:translate(-50%,-70px) scale(1)}}

/* WORLD OBJECTS */
.world-object{position:absolute;transform:translate(-50%,-100%);z-index:15;pointer-events:auto}
.npc{left:24%;top:70%;width:100px;height:155px}
.npc-sprite{width:100%;height:100%;background:url("assets/npcs/quest-npc.png") center bottom/contain no-repeat}
.object-name{position:absolute;left:50%;top:-28px;transform:translateX(-50%);color:white;font-size:15px;font-weight:800;white-space:nowrap;text-shadow:0 2px 3px #000}
.monster{position:absolute;left:70%;top:73%;width:112px;height:92px;transform:translate(-50%,-100%);z-index:15;cursor:pointer}
.monster-sprite{width:100%;height:100%;filter:drop-shadow(0 5px 5px rgba(0,0,0,.5));transform-origin:bottom center;animation:wolfIdle 1.8s ease-in-out infinite alternate}
@keyframes wolfIdle{from{transform:translateY(0)}to{transform:translateY(-3px)}}
.monster.dead{display:none}
.monster-name{position:absolute;left:50%;top:-32px;transform:translateX(-50%);color:white;white-space:nowrap;font-size:14px;font-weight:800;text-shadow:0 2px 3px #000}
.monster-hp{position:absolute;left:50%;top:-13px;transform:translateX(-50%);width:105px;height:9px;border:1px solid #111;background:#111;border-radius:4px;overflow:hidden}
.monster-hp-fill{width:100%;height:100%;background:#dc2626;transition:width .2s}
#moveMarker{position:absolute;width:32px;height:15px;border-radius:50%;border:2px solid rgba(255,255,255,.85);box-shadow:0 0 10px rgba(40,140,255,.9);transform:translate(-50%,-50%);z-index:10;pointer-events:none;animation:marker .65s infinite alternate}
@keyframes marker{from{opacity:.35;transform:translate(-50%,-50%) scale(.75)}to{opacity:1;transform:translate(-50%,-50%) scale(1)}}

/* HUD */
.player-hud{position:fixed;left:12px;top:12px;z-index:50;width:330px;padding:10px;display:flex;gap:10px;border:2px solid #80652e;border-radius:16px;background:rgba(8,13,19,.93);box-shadow:0 7px 22px rgba(0,0,0,.45)}
.avatar{width:66px;height:66px;flex:none;border-radius:50%;border:2px solid #c69c42;background:linear-gradient(#111827,#05070a);display:flex;align-items:center;justify-content:center;color:white;font-size:25px}
.hud-info{flex:1}
.hud-name{display:flex;justify-content:space-between;color:white;font-size:18px;font-weight:800;margin-bottom:6px}
.hud-level{color:#ffd34d}
.stat-bar{position:relative;height:15px;overflow:hidden;margin-bottom:5px;border-radius:8px;background:#111827;border:1px solid #111}
.stat-fill{height:100%;width:100%}
.hp-fill{background:linear-gradient(90deg,#991b1b,#ef4444)}
.mp-fill{background:linear-gradient(90deg,#1d4ed8,#38bdf8)}
.stat-text{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:white;font-size:10px;font-weight:bold;text-shadow:0 1px 2px #000}
.xp-line{display:flex;justify-content:space-between;color:#d1d5db;font-size:11px;margin-top:3px}
.xp-track{height:5px;background:#263244;border-radius:5px;overflow:hidden;margin-top:3px}
#xpFill{height:100%;width:0;background:#facc15;transition:width .2s}
.location{position:fixed;top:12px;right:12px;z-index:50;min-width:270px;padding:10px 18px;text-align:center;border:2px solid #80652e;border-radius:16px;background:rgba(8,13,19,.93);color:white}
.location-title{font-size:17px;font-weight:800}
.location-time{margin-top:3px;color:#e6d28e;font-size:12px}

/* MODALS */
.modal{display:none;position:fixed;inset:0;z-index:1000;background:rgba(0,0,0,.8);justify-content:center;align-items:center}
.modal-content{width:min(450px,94vw);background:#111827;border:2px solid #80652e;border-radius:12px;padding:20px;color:white;box-shadow:0 10px 30px rgba(0,0,0,.9)}
.modal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px;border-bottom:1px solid #374151;padding-bottom:8px}
.modal-header h2{font-size:18px;color:#facc15}
.close-btn{background:none;border:none;color:#fff;font-size:20px;cursor:pointer}
.inv-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;max-height:250px;overflow-y:auto;padding:5px}
.inv-item{background:#1f2937;border:1px solid #4b5563;border-radius:8px;padding:10px;text-align:center;cursor:pointer;font-size:12px;color:white}
.inv-item:hover{border-color:#facc15;background:#374151}

/* SKILLS AND MENU */
.skill-bar{position:fixed;left:50%;bottom:12px;transform:translateX(-50%);z-index:50;display:flex;gap:7px;padding:8px 12px;border:2px solid #725a2e;border-radius:17px;background:rgba(7,11,16,.96);box-shadow:0 7px 25px rgba(0,0,0,.5)}
.skill{position:relative;width:53px;height:53px;display:flex;align-items:center;justify-content:center;border:2px solid #596474;border-radius:10px;background:linear-gradient(135deg,#1e2937,#080c11);color:white;font-size:24px;cursor:pointer}
.skill:hover{border-color:#facc15}
.skill-number{position:absolute;right:4px;bottom:2px;color:white;font-size:10px}
.menu{position:fixed;right:12px;bottom:12px;z-index:50;display:flex;gap:10px;padding:8px 12px;border:2px solid #725a2e;border-radius:17px;background:rgba(7,11,16,.96)}
.menu-item{width:62px;text-align:center;color:white;font-size:10px;cursor:pointer;text-decoration:none}
.menu-icon{width:38px;height:38px;margin:auto auto 3px;display:flex;align-items:center;justify-content:center;border:1px solid #6c5b38;border-radius:9px;background:#1a2430;font-size:19px}

@media(max-width:700px){
 .player-hud{width:245px;padding:7px;gap:6px}
 .avatar{width:46px;height:46px;font-size:20px}
 .hud-name{font-size:14px}
 .location{min-width:0;padding:8px;right:6px;top:90px}
 .location-title{font-size:12px}
 .skill-bar{bottom:8px;gap:3px;padding:5px}
 .skill{width:43px;height:43px;font-size:20px}
 .menu{right:5px;bottom:70px;gap:4px;padding:5px}
 .menu-item{width:47px}
 .menu-icon{width:32px;height:32px}
 #player{width:92px;height:156px}
 #playerFallback{width:92px;height:156px}
}
</style>
<script src="https://unpkg.com/@ruffle-rs/ruffle"></script>
</head>

<body>
<div id="world">
    <img id="map" src="novarise-forest.png" alt="Novarise Forest" onerror="this.style.display='none';document.getElementById('world').style.background='#1c2333';">
    <div id="gameLayer">
        <div id="player">
            <div id="playerFallback">
                <div class="fallback-name" id="playerNameTag">LQS</div>
                <img class="warrior-art" src="warrior-reference.png" alt="Armored fantasy warrior" draggable="false">
                <svg class="warrior-sword-overlay" viewBox="0 0 112 190" aria-hidden="true">
                    <!-- Blade positioned close to the warrior's hand -->
                    <path d="M77 83 L94 22 L101 18 L87 87 L80 94 Z" fill="#e7f1ff" stroke="#26364b" stroke-width="2.2" stroke-linejoin="round"/>
                    <path d="M94 22 L101 18 L87 87 L83 87 Z" fill="#9fb6d2"/>
                    <path d="M69 84 L88 90 L85 96 L67 90 Z" fill="#b88b4d" stroke="#332719" stroke-width="2" stroke-linejoin="round"/>
                    <path d="M77 91 L71 108" stroke="#5b4633" stroke-width="7" stroke-linecap="round"/>
                    <path d="M77 91 L71 108" stroke="#d6b37a" stroke-width="1.5" stroke-linecap="round"/>
                    <path d="M68 106 L75 109" stroke="#26364b" stroke-width="2.5" stroke-linecap="round"/>
                </svg>
                <div id="aqwSwfHost" aria-label="Optional AQW character renderer"></div>
            </div>
        </div>

        <div class="world-object npc" id="npc">
            <div class="npc-sprite"></div>
            <div class="object-name">Seraphine</div>
        </div>

        <div class="monster" id="monster" onclick="attackMonster()">
            <div class="monster-sprite" aria-label="Dire Wolf">
                <svg viewBox="0 0 180 130" role="img" aria-label="Dire Wolf" style="width:100%;height:100%;overflow:visible">
                    <ellipse cx="91" cy="119" rx="54" ry="7" fill="rgba(0,0,0,.42)"/>
                    <path d="M54 82 L48 108 Q45 116 57 116 L70 112 L72 86Z" fill="#4b5563" stroke="#111827" stroke-width="4"/>
                    <path d="M112 82 L119 108 Q124 115 135 111 L137 105 L127 79Z" fill="#374151" stroke="#111827" stroke-width="4"/>
                    <path d="M43 58 Q17 46 15 26 Q35 39 53 44Z" fill="#4b5563" stroke="#111827" stroke-width="4" stroke-linejoin="round"/>
                    <path d="M42 48 Q61 31 94 38 Q119 39 133 58 L123 83 Q94 96 57 82 L39 66Z" fill="#64748b" stroke="#111827" stroke-width="4" stroke-linejoin="round"/>
                    <path d="M55 52 Q75 42 96 49 L112 67 Q86 78 60 68Z" fill="#9ca3af"/>
                    <path d="M68 75 L66 105 Q64 115 77 115 L85 110 L84 77Z" fill="#6b7280" stroke="#111827" stroke-width="4"/>
                    <path d="M103 75 L106 105 Q106 115 119 114 L126 109 L118 74Z" fill="#6b7280" stroke="#111827" stroke-width="4"/>
                    <path d="M105 43 L122 28 L143 34 L157 49 L148 66 L128 70 L111 60Z" fill="#9ca3af" stroke="#111827" stroke-width="4" stroke-linejoin="round"/>
                    <path d="M122 31 L119 10 L137 25Z" fill="#4b5563" stroke="#111827" stroke-width="4" stroke-linejoin="round"/>
                    <path d="M141 32 L151 15 L157 39Z" fill="#4b5563" stroke="#111827" stroke-width="4" stroke-linejoin="round"/>
                    <path d="M146 49 L172 54 L150 64Z" fill="#d1d5db" stroke="#111827" stroke-width="3" stroke-linejoin="round"/>
                    <circle cx="145" cy="43" r="4" fill="#facc15" stroke="#111827" stroke-width="2"/>
                    <circle cx="146" cy="43" r="1.5" fill="#111827"/>
                    <path d="M153 57 L160 58" stroke="#111827" stroke-width="2" stroke-linecap="round"/>
                    <path d="M58 49 L72 41 L86 46" fill="none" stroke="#cbd5e1" stroke-width="3" stroke-linecap="round"/>
                </svg>
            </div>
            <div class="monster-name">Dire Wolf — Lv. 3</div>
            <div class="monster-hp"><div class="monster-hp-fill" id="monsterHpBar"></div></div>
        </div>
        <div id="moveMarker" style="display:none"></div>
    </div>
</div>

<div class="modal" id="inventoryModal">
    <div class="modal-content">
        <div class="modal-header"><h2>🎒 Inventory & Equipment</h2><button class="close-btn" onclick="toggleModal('inventoryModal',false)">×</button></div>
        <p style="font-size:13px;color:#9ca3af;margin-bottom:10px">I-click ang item para isuot:</p>
        <div class="inv-grid" id="inventoryList"></div>
    </div>
</div>

<div class="modal" id="joinModal">
    <div class="modal-content">
        <div class="modal-header"><h2>🗺️ Join Room / Server</h2><button class="close-btn" onclick="toggleModal('joinModal',false)">×</button></div>
        <div style="display:flex;flex-direction:column;gap:10px">
            <label style="font-size:12px;color:#9ca3af">Pangalan ng Room (hal. yulgar-101, battleon):</label>
            <input type="text" id="roomInput" value="yulgar-1205" style="padding:10px;background:#1f2937;border:1px solid #4b5563;color:white;border-radius:6px">
            <button onclick="joinRoom()" style="padding:10px;background:#2563eb;color:white;border:none;border-radius:6px;font-weight:bold;cursor:pointer">Pumunta sa Room</button>
        </div>
    </div>
</div>

<div class="player-hud">
    <div class="avatar">⚔</div>
    <div class="hud-info">
        <div class="hud-name"><span id="hudPlayerName">LQS</span><span class="hud-level" id="playerLevelDisplay">Lv. 1</span></div>
        <div class="stat-bar"><div class="stat-fill hp-fill"></div><div class="stat-text">100 / 100</div></div>
        <div class="stat-bar"><div class="stat-fill mp-fill"></div><div class="stat-text">100 / 100</div></div>
        <div class="xp-line"><span>EXP</span><span id="xpText">0 / 50</span></div>
        <div class="xp-track"><div id="xpFill"></div></div>
    </div>
</div>

<div class="location">
    <div class="location-title" id="roomTitle">☀ Novarise Forest [yulgar-1205]</div>
    <div class="location-time" id="clock">--:--</div>
</div>

<div class="skill-bar">
    <button class="skill" onclick="attackMonster()">⚔<span class="skill-number">1</span></button>
    <button class="skill" onclick="attackMonster()">✦<span class="skill-number">2</span></button>
    <button class="skill" onclick="attackMonster()">🔥<span class="skill-number">3</span></button>
    <button class="skill" onclick="attackMonster()">🛡<span class="skill-number">4</span></button>
    <button class="skill" onclick="attackMonster()">🧪<span class="skill-number">5</span></button>
</div>

<div class="menu">
    <a href="character.html" class="menu-item"><div class="menu-icon">🧙</div>Custom</a>
    <div class="menu-item" onclick="toggleModal('inventoryModal',true)"><div class="menu-icon">🎒</div>Bag</div>
    <div class="menu-item" onclick="toggleModal('joinModal',true)"><div class="menu-icon">🚪</div>Join</div>
    <div class="menu-item" onclick="toggleAqwRenderer()"><div class="menu-icon">⚙</div>Info</div>
</div>

<script>
const player=document.getElementById("player");
const fallback=document.getElementById("playerFallback");
const marker=document.getElementById("moveMarker");

let playerX=50,playerY=68,targetX=50,targetY=68,moving=false;
let monsterHp=100,monsterAlive=true,monsterRespawnTimer=null;
let playerLevel=1,playerExp=0,expNeeded=50;
let aqwRendererEnabled=false,aqwRufflePlayer=null;

async function toggleAqwRenderer(){
    const host=document.getElementById("aqwSwfHost");
    if(aqwRendererEnabled){
        aqwRendererEnabled=false;
        fallback.classList.remove("swf-mode");
        host.innerHTML="";
        aqwRufflePlayer=null;
        return;
    }
    try{
        if(!window.RufflePlayer||!window.RufflePlayer.newest){
            alert("Hindi na-load ang Ruffle. I-check ang internet connection at subukan ulit.");
            return;
        }
        window.RufflePlayer.config={autoplay:"on",unmuteOverlay:"hidden",letterbox:"on",backgroundColor:"#00000000",logLevel:"error"};
        const ruffle=window.RufflePlayer.newest();
        const playerEl=ruffle.createPlayer();
        playerEl.className="aqw-swf-player";
        host.innerHTML="";
        host.appendChild(playerEl);
        aqwRufflePlayer=playerEl;
        await playerEl.load({
            url:"character5.swf",
            parameters:{
                intColorHair:"0x6b3f20",intColorSkin:"0xf0c18b",intColorEye:"0x2d9cdb",
                intColorTrim:"0x64748b",intColorBase:"0x334155",intColorAccessory:"0x8b5e34",
                ia1:"13600",strGender:"M",strHairFile:"",strHairName:"",strName:"LQS",
                intLevel:"1",strClassName:"Warrior",strClassFile:"",strClassLink:"",
                strArmorName:"Warrior",strWeaponFile:"",strWeaponLink:"",strWeaponType:"Sword",
                strWeaponName:"Warrior Sword",strCapeFile:"",strCapeLink:"",strCapeName:"",
                strHelmFile:"",strHelmLink:"",strHelmName:"",strPetFile:"",strPetLink:"",
                strPetName:"",bgindex:"9",strFaction:"Warrior"
            }
        });
        aqwRendererEnabled=true;
        fallback.classList.add("swf-mode");
    }catch(err){
        host.innerHTML="";
        fallback.classList.remove("swf-mode");
        aqwRendererEnabled=false;
        alert("Hindi ma-load ang character5.swf. Ibinalik ang warrior image. Siguraduhing nasa parehong folder ang SWF file.");
        console.error("SWF renderer error:",err);
    }
}

const inventoryItems=[
    {name:"Shadow Robe",type:"armor",color:"#374151"},
    {name:"Mage Purple Robe",type:"armor",color:"#c084fc"},
    {name:"Golden Horn Helm",type:"helm",color:"#f59e0b"},
    {name:"Shadow Knight Helm",type:"helm",color:"#991b1b"},
    {name:"Blood Cape",type:"cape",color:"#dc2626"},
    {name:"Royal Blue Cape",type:"cape",color:"#2563eb"},
    {name:"Crystal Staff",type:"weapon",color:"#38bdf8"},
    {name:"Dragon Blade",type:"weapon",color:"#ef4444"}
];

function renderInventory(){
    const list=document.getElementById("inventoryList");
    list.innerHTML="";
    inventoryItems.forEach(item=>{
        const div=document.createElement("div");
        div.className="inv-item";
        div.innerHTML=`<strong>${item.name}</strong><br><span style="color:#9ca3af;font-size:10px">${item.type}</span>`;
        div.onclick=()=>equipItem(item);
        list.appendChild(div);
    });
}
renderInventory();

function equipItem(item){
    alert(`Napili mo ang ${item.name}. Ang visual equipment system ay kailangan pang iugnay sa character renderer.`);
}

function toggleModal(id,show){
    document.getElementById(id).style.display=show?"flex":"none";
}

function joinRoom(){
    const roomName=document.getElementById("roomInput").value.trim()||"yulgar-1205";
    document.getElementById("roomTitle").textContent=`☀ Novarise Forest [${roomName}]`;
    toggleModal("joinModal",false);
    alert(`Room name changed to: ${roomName}`);
}

function updatePlayerPosition(){
    player.style.left=playerX+"%";
    player.style.top=playerY+"%";
}

document.getElementById("gameLayer").addEventListener("click",function(event){
    if(event.target.closest(".world-object,.monster,.portal,.modal"))return;
    const rect=this.getBoundingClientRect();
    targetX=((event.clientX-rect.left)/rect.width)*100;
    targetY=((event.clientY-rect.top)/rect.height)*100;
    if(targetX<playerX)fallback.classList.add("face-left");
    else fallback.classList.remove("face-left");
    targetX=Math.max(5,Math.min(95,targetX));
    targetY=Math.max(25,Math.min(87,targetY));
    moving=true;
    showMarker(event.clientX,event.clientY);
});

function movementLoop(){
    if(moving){
        const dx=targetX-playerX,dy=targetY-playerY;
        const distance=Math.sqrt(dx*dx+dy*dy);
        if(distance<.35){
            playerX=targetX;playerY=targetY;moving=false;stopWalking();
        }else{
            const speed=Math.min(.22,distance*.08);
            playerX+=(dx/distance)*speed;
            playerY+=(dy/distance)*speed;
        }
        updatePlayerPosition();
    }
    requestAnimationFrame(movementLoop);
}
movementLoop();

function startWalking(){if(!fallback.classList.contains("jumping")&&!fallback.classList.contains("attacking"))fallback.classList.add("running")}
function stopWalking(){fallback.classList.remove("running")}

let jumpLock=false;
function jumpCharacter(){
    if(jumpLock)return;
    jumpLock=true;
    fallback.classList.remove("running");
    fallback.classList.add("jumping");
    setTimeout(()=>{
        fallback.classList.remove("jumping");
        jumpLock=false;
        if(moving)startWalking();
    },640);
}

function attackMonster(){
    if(!monsterAlive)return;
    fallback.classList.remove("running");
    fallback.classList.add("attacking");
    setTimeout(()=>{
        fallback.classList.remove("attacking");
        if(moving)startWalking();
    },400);

    const dmg=Math.floor(Math.random()*18)+12;
    monsterHp=Math.max(0,monsterHp-dmg);
    document.getElementById("monsterHpBar").style.width=monsterHp+"%";

    const monsterElem=document.getElementById("monster");
    const rect=monsterElem.getBoundingClientRect();
    const pop=document.createElement("div");
    pop.className="damage-pop";
    pop.textContent="-"+dmg;
    pop.style.left=(rect.left+rect.width/2)+"px";
    pop.style.top=rect.top+"px";
    document.body.appendChild(pop);
    setTimeout(()=>pop.remove(),800);

    if(monsterHp<=0){
        monsterAlive=false;
        monsterElem.classList.add("dead");
        gainExp(25);

        const notice=document.createElement("div");
        notice.className="damage-pop";
        notice.style.color="#86efac";
        notice.style.fontSize="20px";
        notice.style.left=(rect.left+rect.width/2)+"px";
        notice.style.top=(rect.top-18)+"px";
        notice.textContent="Dire Wolf defeated! +25 EXP";
        document.body.appendChild(notice);
        setTimeout(()=>notice.remove(),1400);

        clearTimeout(monsterRespawnTimer);
        monsterRespawnTimer=setTimeout(()=>{
            monsterHp=100;
            monsterAlive=true;
            document.getElementById("monsterHpBar").style.width="100%";
            monsterElem.classList.remove("dead");
        },60000);
    }
}

function gainExp(amount){
    playerExp+=amount;
    while(playerExp>=expNeeded){
        playerExp-=expNeeded;
        playerLevel++;
        expNeeded=Math.floor(expNeeded*1.5);
        document.getElementById("playerLevelDisplay").textContent="Lv. "+playerLevel;
        const pop=document.createElement("div");
        pop.className="damage-pop";
        pop.style.color="#fde047";
        pop.style.left="50%";
        pop.style.top="35%";
        pop.textContent="LEVEL UP! Lv. "+playerLevel;
        document.body.appendChild(pop);
        setTimeout(()=>pop.remove(),1600);
    }
    document.getElementById("xpText").textContent=playerExp+" / "+expNeeded;
    document.getElementById("xpFill").style.width=(playerExp/expNeeded*100)+"%";
}

function showMarker(x,y){
    marker.style.left=x+"px";
    marker.style.top=y+"px";
    marker.style.display="block";
    clearTimeout(marker.timer);
    marker.timer=setTimeout(()=>marker.style.display="none",700);
}

const keys={};
window.addEventListener("keydown",e=>{
    const key=e.key.toLowerCase();
    if(key===" "||key==="spacebar"){
        e.preventDefault();
        if(!e.repeat)jumpCharacter();
        return;
    }
    keys[key]=true;
    if(["1","2","3","4","5"].includes(e.key))attackMonster();
});
window.addEventListener("keyup",e=>{keys[e.key.toLowerCase()]=false});

function keyboardMovement(){
    let dx=0,dy=0;
    if(keys["w"]||keys["arrowup"])dy=-1;
    if(keys["s"]||keys["arrowdown"])dy=1;
    if(keys["a"]||keys["arrowleft"]){dx=-1;fallback.classList.add("face-left")}
    if(keys["d"]||keys["arrowright"]){dx=1;fallback.classList.remove("face-left")}
    if(dx===0&&dy===0)return;
    const length=Math.sqrt(dx*dx+dy*dy);
    dx/=length;dy/=length;
    playerX+=dx*.45;
    playerY+=dy*.45;
    playerX=Math.max(5,Math.min(95,playerX));
    playerY=Math.max(25,Math.min(87,playerY));
    targetX=playerX;targetY=playerY;moving=true;
    startWalking();
    updatePlayerPosition();
}
setInterval(keyboardMovement,16);

function updateClock(){
    const now=new Date();
    document.getElementById("clock").textContent=now.toLocaleTimeString([],{hour:"numeric",minute:"2-digit"});
}
setInterval(updateClock,1000);
updateClock();

updatePlayerPosition();
</script>
</body>
</html>
