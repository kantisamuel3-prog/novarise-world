<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Novarise World</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#08111c;
    font-family:Arial,Helvetica,sans-serif;
}

#game{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    display:block;
    cursor:crosshair;
}

/* =========================
   TOP PLAYER PANEL
========================= */

.player-panel{
    position:fixed;
    top:14px;
    left:14px;
    z-index:20;

    width:330px;
    min-height:88px;

    display:flex;
    align-items:center;

    padding:10px 14px;

    border:2px solid #8b6a32;
    border-radius:18px;

    background:
        linear-gradient(
            135deg,
            rgba(10,14,20,.96),
            rgba(31,36,43,.92)
        );

    box-shadow:
        0 8px 25px rgba(0,0,0,.45),
        inset 0 1px rgba(255,255,255,.08);

    color:white;
}

.avatar{
    width:62px;
    height:62px;
    flex:none;

    border-radius:50%;

    display:flex;
    align-items:center;
    justify-content:center;

    margin-right:12px;

    background:
        radial-gradient(circle at 50% 35%,#f4c28d 0 20%,transparent 21%),
        linear-gradient(#182334,#080b10);

    border:2px solid #c39a4a;

    font-size:30px;
}

.player-info{
    flex:1;
}

.player-name{
    display:flex;
    justify-content:space-between;

    font-size:17px;
    font-weight:800;

    margin-bottom:7px;
}

.level{
    color:#ffd76a;
}

.bar{
    position:relative;

    width:100%;
    height:14px;

    margin-bottom:5px;

    overflow:hidden;

    border-radius:8px;

    background:#111827;
    border:1px solid #374151;
}

.bar-fill{
    height:100%;
    width:100%;
}

.hp{
    background:linear-gradient(90deg,#991b1b,#ef4444);
}

.mp{
    background:linear-gradient(90deg,#1d4ed8,#38bdf8);
}

.bar-text{
    position:absolute;
    inset:0;

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:10px;
    font-weight:bold;
    text-shadow:0 1px 2px #000;
}

/* =========================
   LOCATION PANEL
========================= */

.location{
    position:fixed;
    top:14px;
    right:14px;

    z-index:20;

    min-width:250px;

    padding:11px 20px;

    text-align:center;

    color:white;

    border:2px solid #8b6a32;
    border-radius:18px;

    background:rgba(12,16,22,.92);

    box-shadow:0 8px 25px rgba(0,0,0,.4);
}

.location-title{
    font-size:17px;
    font-weight:800;
}

.location-time{
    margin-top:3px;
    color:#e8d59b;
    font-size:13px;
}

/* =========================
   INTERACTIVE LABELS
========================= */

.world-label{
    position:absolute;
    z-index:10;

    transform:translate(-50%,-100%);

    color:white;

    text-align:center;

    pointer-events:none;

    text-shadow:
        0 2px 3px #000,
        0 0 4px #000;
}

.world-label .name{
    font-size:15px;
    font-weight:800;
}

.world-label .sub{
    font-size:11px;
    color:#ffe45c;
}

/* =========================
   NPC
========================= */

.npc{
    position:absolute;
    z-index:8;

    width:48px;
    height:82px;

    transform:translate(-50%,-100%);

    pointer-events:none;
}

.npc-head{
    position:absolute;

    width:30px;
    height:30px;

    top:0;
    left:9px;

    border-radius:50%;

    background:#efbd83;
    border:2px solid #6b4327;
}

.npc-hair{
    position:absolute;

    width:32px;
    height:18px;

    top:-1px;
    left:8px;

    border-radius:18px 18px 6px 6px;

    background:#713f1d;

    z-index:2;
}

.npc-body{
    position:absolute;

    width:38px;
    height:48px;

    left:5px;
    top:27px;

    border-radius:10px 10px 4px 4px;

    background:linear-gradient(
        90deg,
        #1e3a5f,
        #f5e7c2,
        #1e3a5f
    );

    border:2px solid #9c7a3c;
}

/* =========================
   MONSTER
========================= */

.monster{
    position:absolute;
    z-index:8;

    width:105px;
    height:85px;

    transform:translate(-50%,-100%);

    pointer-events:none;
}

.wolf-body{
    position:absolute;

    width:78px;
    height:48px;

    left:12px;
    top:28px;

    border-radius:45% 50% 40% 35%;

    background:linear-gradient(
        135deg,
        #111827,
        #374151
    );

    border:3px solid #0b0f14;
}

.wolf-head{
    position:absolute;

    width:43px;
    height:43px;

    right:1px;
    top:12px;

    border-radius:50%;

    background:#1f2937;

    border:3px solid #090d12;
}

.wolf-ear{
    position:absolute;

    width:17px;
    height:22px;

    top:-12px;

    background:#111827;

    transform:rotate(25deg);

    border:2px solid #090d12;
}

.wolf-ear.left{
    left:3px;
}

.wolf-ear.right{
    right:3px;
    transform:rotate(-25deg);
}

.wolf-eye{
    position:absolute;

    width:6px;
    height:6px;

    border-radius:50%;

    background:#ef4444;

    top:18px;
}

.wolf-eye.left{
    left:10px;
}

.wolf-eye.right{
    right:10px;
}

.wolf-hp{
    position:absolute;

    top:-20px;
    left:10px;

    width:85px;
    height:9px;

    background:#111;

    border:1px solid #000;
}

.wolf-hp-fill{
    width:100%;
    height:100%;

    background:#dc2626;
}

/* =========================
   PORTAL
========================= */

.portal{
    position:absolute;
    z-index:7;

    width:85px;
    height:115px;

    transform:translate(-50%,-100%);

    border-radius:50% 50% 45% 45%;

    background:
        radial-gradient(
            ellipse at center,
            #d8f7ff 0%,
            #38bdf8 20%,
            #2563eb 50%,
            #172554 75%,
            transparent 76%
        );

    box-shadow:
        0 0 20px #38bdf8,
        0 0 45px rgba(37,99,235,.7);

    animation:portalPulse 1.8s infinite alternate;

    pointer-events:none;
}

@keyframes portalPulse{
    from{
        transform:translate(-50%,-100%) scale(.96);
    }
    to{
        transform:translate(-50%,-100%) scale(1.04);
    }
}

/* =========================
   CHAT
========================= */

.chat{
    position:fixed;

    left:12px;
    bottom:12px;

    z-index:30;

    width:430px;
    height:165px;

    border:2px solid #6d552d;
    border-radius:14px;

    overflow:hidden;

    background:rgba(5,9,14,.91);

    box-shadow:0 8px 25px rgba(0,0,0,.45);
}

.chat-tabs{
    display:flex;

    height:35px;

    background:#151b24;
}

.chat-tab{
    padding:8px 20px;

    color:#b9c1ca;

    font-size:13px;
    font-weight:bold;
}

.chat-tab.active{
    color:white;

    background:#1758bd;
}

.chat-messages{
    padding:9px 12px;

    height:83px;

    color:#d9e1e8;

    font-size:12px;
}

.welcome{
    color:#facc15;
    font-weight:bold;
}

.chat-location{
    color:#22d3ee;
    margin-top:5px;
}

.chat-input{
    position:absolute;

    bottom:0;
    left:0;
    right:0;

    height:42px;

    display:flex;

    border-top:1px solid #343b45;
}

.chat-input input{
    flex:1;

    border:0;
    outline:0;

    padding:0 12px;

    color:white;

    background:#0c1219;
}

.chat-input button{
    width:65px;

    border:0;

    color:white;
    font-weight:bold;

    background:#d88b1b;
}

/* =========================
   ACTION BAR
========================= */

.action-bar{
    position:fixed;

    left:50%;
    bottom:15px;

    transform:translateX(-50%);

    z-index:30;

    display:flex;
    gap:7px;

    padding:9px 14px;

    border:2px solid #765c30;
    border-radius:20px;

    background:rgba(10,14,19,.94);

    box-shadow:0 8px 30px rgba(0,0,0,.5);
}

.skill{
    width:53px;
    height:53px;

    display:flex;
    align-items:center;
    justify-content:center;

    border:2px solid #6b7280;
    border-radius:12px;

    color:white;

    font-size:25px;

    background:linear-gradient(
        135deg,
        #182230,
        #05080d
    );

    cursor:pointer;
}

.skill:hover{
    border-color:#facc15;
    transform:translateY(-2px);
}

.skill-number{
    position:absolute;

    font-size:10px;
    color:#ddd;

    margin:39px 0 0 38px;
}

/* =========================
   MENU
========================= */

.menu{
    position:fixed;

    right:12px;
    bottom:12px;

    z-index:30;

    display:flex;

    padding:9px 13px;

    gap:15px;

    border:2px solid #765c30;
    border-radius:18px;

    background:rgba(10,14,19,.94);

    box-shadow:0 8px 25px rgba(0,0,0,.45);
}

.menu-item{
    width:58px;

    text-align:center;

    color:white;

    font-size:11px;

    cursor:pointer;
}

.menu-icon{
    width:38px;
    height:38px;

    margin:auto auto 4px;

    display:flex;
    align-items:center;
    justify-content:center;

    border-radius:10px;

    border:1px solid #6d552d;

    background:#1b2430;

    font-size:20px;
}

/* =========================
   CLICK MARKER
========================= */

.move-marker{
    position:absolute;

    width:24px;
    height:24px;

    z-index:9;

    transform:translate(-50%,-50%);

    border:3px solid rgba(255,255,255,.85);

    border-radius:50%;

    box-shadow:
        0 0 0 4px rgba(37,99,235,.35),
        0 0 15px rgba(37,99,235,.8);

    animation:marker .7s infinite alternate;

    pointer-events:none;
}

@keyframes marker{
    from{
        opacity:.45;
        transform:translate(-50%,-50%) scale(.8);
    }

    to{
        opacity:1;
        transform:translate(-50%,-50%) scale(1);
    }
}

/* =========================
   MOBILE
========================= */

.mobile-controls{
    display:none;

    position:fixed;

    left:15px;
    bottom:20px;

    z-index:50;
}

.mobile-controls button{
    width:52px;
    height:52px;

    border:1px solid rgba(255,255,255,.25);
    border-radius:13px;

    color:white;

    background:rgba(0,0,0,.6);

    font-size:21px;

    touch-action:none;
}

.mobile-row{
    display:flex;
    gap:5px;
    margin-top:5px;
}

@media(max-width:800px){

    .player-panel{
        width:245px;
        min-height:70px;
        padding:7px;
        top:7px;
        left:7px;
    }

    .avatar{
        width:45px;
        height:45px;
        font-size:22px;
    }

    .player-name{
        font-size:13px;
    }

    .location{
        top:7px;
        right:7px;
        min-width:145px;
        padding:7px;
    }

    .location-title{
        font-size:12px;
    }

    .location-time{
        font-size:10px;
    }

    .chat{
        width:calc(100% - 30px);
        left:15px;
        bottom:82px;
        height:125px;
    }

    .action-bar{
        bottom:12px;
        left:auto;
        right:10px;
        transform:none;
    }

    .skill{
        width:43px;
        height:43px;
        font-size:20px;
    }

    .menu{
        display:none;
    }

    .mobile-controls{
        display:block;
    }
}
</style>
</head>

<body>

<canvas id="game"></canvas>

<script>

/* =========================================================
   NOVARISE WORLD
========================================================= */

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

const background = new Image();

/*
    IMPORTANT:
    This must match the filename you uploaded.
*/
background.src = "assets/maps/novarise-forest.png";

let W = window.innerWidth;
let H = window.innerHeight;

function resize(){

    W = window.innerWidth;
    H = window.innerHeight;

    canvas.width = W;
    canvas.height = H;

}

window.addEventListener("resize", resize);

resize();

/* =========================================================
   PLAYER
========================================================= */

const player = {

    x:0.50,
    y:0.70,

    targetX:0.50,
    targetY:0.70,

    speed:0.0018,

    moving:false,

    direction:1

};

/* =========================================================
   BACKGROUND
========================================================= */

function drawBackground(){

    if(!background.complete || !background.naturalWidth){

        ctx.fillStyle="#101820";

        ctx.fillRect(0,0,W,H);

        ctx.fillStyle="white";

        ctx.font="20px Arial";

        ctx.textAlign="center";

        ctx.fillText(
            "Loading Novarise Forest...",
            W/2,
            H/2
        );

        return;
    }

    const imageRatio =
        background.naturalWidth /
        background.naturalHeight;

    const screenRatio =
        W / H;

    let drawWidth;
    let drawHeight;

    /*
        Cover the entire screen.
    */

    if(screenRatio > imageRatio){

        drawWidth = W;
        drawHeight = W / imageRatio;

    }else{

        drawHeight = H;
        drawWidth = H * imageRatio;

    }

    const x =
        (W - drawWidth) / 2;

    const y =
        (H - drawHeight) / 2;

    ctx.drawImage(
        background,
        x,
        y,
        drawWidth,
        drawHeight
    );

}

/* =========================================================
   PLAYER POSITION
========================================================= */

function getPlayerScreen(){

    return {

        x:player.x * W,

        y:player.y * H

    };

}

/* =========================================================
   DRAW PLAYER
========================================================= */

function drawPlayer(){

    const p = getPlayerScreen();

    const x = p.x;
    const y = p.y;

    /*
        Shadow
    */

    ctx.save();

    ctx.fillStyle =
        "rgba(0,0,0,.38)";

    ctx.beginPath();

    ctx.ellipse(
        x,
        y + 29,
        28,
        9,
        0,
        0,
        Math.PI * 2
    );

    ctx.fill();

    /*
        Cape
    */

    ctx.fillStyle =
        "#111827";

    ctx.beginPath();

    ctx.moveTo(
        x - 19,
        y - 10
    );

    ctx.lineTo(
        x - 35,
        y + 32
    );

    ctx.lineTo(
        x - 8,
        y + 27
    );

    ctx.closePath();

    ctx.fill();

    /*
        Body armor
    */

    const armor =
        ctx.createLinearGradient(
            x-20,
            y,
            x+20,
            y
        );

    armor.addColorStop(
        0,
        "#111827"
    );

    armor.addColorStop(
        .5,
        "#64748b"
    );

    armor.addColorStop(
        1,
        "#111827"
    );

    ctx.fillStyle=armor;

    ctx.beginPath();

    ctx.roundRect(
        x-19,
        y-5,
        38,
        46,
        8
    );

    ctx.fill();

    ctx.strokeStyle="#cbd5e1";
    ctx.lineWidth=2;

    ctx.stroke();

    /*
        Head
    */

    ctx.fillStyle="#efbd83";

    ctx.beginPath();

    ctx.arc(
        x,
        y-27,
        17,
        0,
        Math.PI*2
    );

    ctx.fill();

    /*
        Hair
    */

    ctx.fillStyle="#111827";

    ctx.beginPath();

    ctx.arc(
        x,
        y-32,
        18,
        Math.PI,
        Math.PI*2
    );

    ctx.fill();

    /*
        Sword
    */

    ctx.save();

    ctx.translate(
        x+17,
        y+8
    );

    ctx.rotate(
        player.direction > 0
        ? -0.65
        : 0.65
    );

    ctx.fillStyle="#dbeafe";

    ctx.beginPath();

    ctx.moveTo(0,-8);
    ctx.lineTo(8,-55);
    ctx.lineTo(14,-8);
    ctx.closePath();

    ctx.fill();

    ctx.strokeStyle="#475569";
    ctx.lineWidth=2;

    ctx.stroke();

    /*
        Sword handle
    */

    ctx.fillStyle="#7c2d12";

    ctx.fillRect(
        -3,
        -5,
        8,
        22
    );

    ctx.restore();

    /*
        Name
    */

    ctx.fillStyle="white";

    ctx.font="bold 14px Arial";

    ctx.textAlign="center";

    ctx.shadowColor="#000";
    ctx.shadowBlur=5;

    ctx.fillText(
        "Novarise",
        x,
        y-55
    );

    ctx.shadowBlur=0;

    ctx.restore();

}

/* =========================================================
   PLAYER MOVEMENT
========================================================= */

function updatePlayer(){

    const dx =
        player.targetX -
        player.x;

    const dy =
        player.targetY -
        player.y;

    const distance =
        Math.sqrt(
            dx*dx +
            dy*dy
        );

    if(distance < 0.002){

        player.x =
            player.targetX;

        player.y =
            player.targetY;

        player.moving=false;

        return;

    }

    player.moving=true;

    player.direction =
        dx >= 0
        ? 1
        : -1;

    player.x +=
        (dx / distance) *
        player.speed;

    player.y +=
        (dy / distance) *
        player.speed;

}

/* =========================================================
   CLICK TO MOVE
========================================================= */

canvas.addEventListener(
    "click",
    function(event){

        const rect =
            canvas.getBoundingClientRect();

        const x =
            (event.clientX - rect.left) /
            rect.width;

        const y =
            (event.clientY - rect.top) /
            rect.height;

        /*
            Don't allow player to walk
            into the HUD areas.
        */

        if(y < .14) return;

        player.targetX =
            Math.max(
                .04,
                Math.min(.96,x)
            );

        player.targetY =
            Math.max(
                .25,
                Math.min(.88,y)
            );

        showMoveMarker(
            x * W,
            y * H
        );

    }
);

/* =========================================================
   MOVE MARKER
========================================================= */

function showMoveMarker(x,y){

    const marker =
        document.getElementById(
            "moveMarker"
        );

    marker.style.left =
        x+"px";

    marker.style.top =
        y+"px";

    marker.style.display =
        "block";

    clearTimeout(
        marker.hideTimer
    );

    marker.hideTimer =
        setTimeout(
            ()=>{
                marker.style.display="none";
            },
            900
        );

}

/* =========================================================
   KEYBOARD MOVEMENT
========================================================= */

const keys={};

window.addEventListener(
    "keydown",
    e=>{

        keys[e.key.toLowerCase()]=true;

    }
);

window.addEventListener(
    "keyup",
    e=>{

        keys[e.key.toLowerCase()]=false;

    }
);

function keyboardMovement(){

    let dx=0;
    let dy=0;

    if(keys["w"] || keys["arrowup"])
        dy=-1;

    if(keys["s"] || keys["arrowdown"])
        dy=1;

    if(keys["a"] || keys["arrowleft"])
        dx=-1;

    if(keys["d"] || keys["arrowright"])
        dx=1;

    if(!dx && !dy)
        return;

    const length =
        Math.sqrt(dx*dx+dy*dy);

    dx/=length;
    dy/=length;

    player.x +=
        dx * .0025;

    player.y +=
        dy * .0025;

    player.x =
        Math.max(
            .04,
            Math.min(.96,player.x)
        );

    player.y =
        Math.max(
            .25,
            Math.min(.88,player.y)
        );

    player.targetX=player.x;
    player.targetY=player.y;

    player.direction =
        dx>=0 ? 1 : -1;

}

/* =========================================================
   MOBILE CONTROLS
========================================================= */

function mobileMove(dx,dy){

    player.x += dx;
    player.y += dy;

    player.x =
        Math.max(
            .04,
            Math.min(.96,player.x)
        );

    player.y =
        Math.max(
            .25,
            Math.min(.88,player.y)
        );

    player.targetX=player.x;
    player.targetY=player.y;

}

document
.getElementById("up")
.addEventListener(
    "pointerdown",
    ()=>mobileMove(0,-.025)
);

document
.getElementById("down")
.addEventListener(
    "pointerdown",
    ()=>mobileMove(0,.025)
);

document
.getElementById("left")
.addEventListener(
    "pointerdown",
    ()=>mobileMove(-.025,0)
);

document
.getElementById("right")
.addEventListener(
    "pointerdown",
    ()=>mobileMove(.025,0)
);

/* =========================================================
   CLOCK
========================================================= */

function updateClock(){

    const now =
        new Date();

    document
    .getElementById("time")
    .textContent =
        now.toLocaleTimeString(
            [],
            {
                hour:"numeric",
                minute:"2-digit"
            }
        );

}

setInterval(
    updateClock,
    1000
);

updateClock();

/* =========================================================
   CHAT
========================================================= */

document
.getElementById("sendChat")
.addEventListener(
    "click",
    sendChat
);

document
.getElementById("chatInput")
.addEventListener(
    "keydown",
    e=>{

        if(e.key==="Enter")
            sendChat();

    }
);

function sendChat(){

    const input =
        document.getElementById(
            "chatInput"
        );

    const message =
        input.value.trim();

    if(!message)
        return;

    const messages =
        document.querySelector(
            ".chat-messages"
        );

    const line =
        document.createElement("div");

    line.style.marginTop="4px";

    line.innerHTML =
        `<strong style="color:#60a5fa">
        Novarise:
        </strong> ${escapeHtml(message)}`;

    messages.appendChild(line);

    input.value="";

    messages.scrollTop =
        messages.scrollHeight;

}

function escapeHtml(text){

    const div =
        document.createElement("div");

    div.textContent=text;

    return div.innerHTML;

}

/* =========================================================
   GAME LOOP
========================================================= */

function loop(){

    keyboardMovement();

    updatePlayer();

    drawBackground();

    drawPlayer();

    requestAnimationFrame(loop);

}

background.onload=()=>{
    loop();
};

background.onerror=()=>{

    console.error(
        "Could not load assets/maps/novarise-forest.png"
    );

    loop();

};

</script>
