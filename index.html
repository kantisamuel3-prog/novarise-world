<!DOCTYPE html>
<html lang="tl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AQW / RedAQ Style 2D Game</title>

  <!-- Phaser 3 CDN (Game Engine) -->
  <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      background-color: #111;
      color: #fff;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    /* Container para sa buong laro */
    #game-container {
      position: relative;
      width: 960px;
      height: 540px;
      border: 3px solid #444;
      box-shadow: 0 0 20px rgba(0,0,0,0.8);
      overflow: hidden;
      background-color: #000;
    }

    /* Canvas ng Laro */
    #phaser-game {
      width: 100%;
      height: 100%;
    }

    /* --- HUD OVERLAY (UI SA TAAS AT IBABA) --- */

    /* Player Profile HUD (Upper Left) */
    .player-hud {
      position: absolute;
      top: 15px;
      left: 15px;
      display: flex;
      align-items: center;
      gap: 10px;
      background: rgba(0, 0, 0, 0.6);
      padding: 8px 12px;
      border-radius: 8px;
      border: 1px solid #555;
      z-index: 10;
    }

    .avatar {
      width: 45px;
      height: 45px;
      background-color: #ff9900;
      border-radius: 50%;
      border: 2px solid #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      font-weight: bold;
    }

    .bars {
      display: flex;
      flex-direction: column;
      gap: 4px;
      width: 140px;
    }

    .bar-label {
      font-size: 11px;
      margin-bottom: 2px;
    }

    .bar-bg {
      width: 100%;
      height: 10px;
      background: #333;
      border-radius: 4px;
      overflow: hidden;
    }

    .hp-fill { width: 100%; height: 100%; background: #e74c3c; }
    .mp-fill { width: 80%; height: 100%; background: #3498db; }

    /* Action Bar (Bottom Center) */
    .action-bar {
      position: absolute;
      bottom: 15px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 6px;
      background: rgba(0, 0, 0, 0.7);
      padding: 8px 12px;
      border-radius: 8px;
      border: 1px solid #555;
      z-index: 10;
    }

    .skill-btn {
      width: 42px;
      height: 42px;
      background: #222;
      border: 1px solid #777;
      color: #fff;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
      transition: background 0.2s;
    }

    .skill-btn:hover {
      background: #444;
      border-color: #ffb700;
    }

    /* Chat Log Overlay (Bottom Left) */
    .chat-box {
      position: absolute;
      bottom: 15px;
      left: 15px;
      width: 220px;
      background: rgba(0, 0, 0, 0.6);
      padding: 8px;
      border-radius: 6px;
      font-size: 12px;
      z-index: 10;
    }

    .chat-messages {
      height: 60px;
      overflow-y: auto;
      margin-bottom: 5px;
      color: #ccc;
    }

    .chat-input {
      width: 100%;
      padding: 4px;
      background: #222;
      border: 1px solid #444;
      color: #fff;
      border-radius: 3px;
    }
  </style>
</head>
<body>

  <div id="game-container">
    <!-- Phaser Game Canvas -->
    <div id="phaser-game"></div>

    <!-- Player HUD (Upper Left) -->
    <div class="player-hud">
      <div class="avatar">69</div>
      <div class="bars">
        <div class="bar-label">MR JELLYBEAN</div>
        <div class="bar-bg"><div class="hp-fill"></div></div>
        <div class="bar-bg"><div class="mp-fill"></div></div>
      </div>
    </div>

    <!-- Chat Box (Bottom Left) -->
    <div class="chat-box">
      <div class="chat-messages" id="chat-log">
        <div><span style="color:#f1c40f;">System:</span> Welcome to the game!</div>
      </div>
      <input type="text" class="chat-input" placeholder="Press Enter to chat..." id="chat-input">
    </div>

    <!-- Skill Bar (Bottom Center) -->
    <div class="action-bar">
      <button class="skill-btn" onclick="useSkill(1)">1</button>
      <button class="skill-btn" onclick="useSkill(2)">2</button>
      <button class="skill-btn" onclick="useSkill(3)">3</button>
      <button class="skill-btn" onclick="useSkill(4)">4</button>
      <button class="skill-btn" onclick="useSkill(5)">5</button>
    </div>
  </div>

  <script>
    // --- PHASER 3 GAME ENGINE CONFIGURATION ---
    const config = {
      type: Phaser.AUTO,
      width: 960,
      height: 540,
      parent: 'phaser-game',
      physics: {
        default: 'arcade',
        arcade: { debug: false }
      },
      scene: {
        preload: preload,
        create: create,
        update: update
      }
    };

    const game = new Phaser.Game(config);
    let player;
    let targetX, targetY;
    let isMoving = false;

    function preload() {
      // Dito mo i-load ang iyong background at character sprites halimbawa:
      // this.load.image('forest', 'assets/forest_bg.png');
    }

    function create() {
      // Kulay muna ng Lupa (Background) habang wala pang image
      this.add.rectangle(480, 270, 960, 540, 0x2e7d32); 

      // Daanan (Path)
      const path = this.add.graphics();
      path.fillStyle(0x8d6e63, 1);
      path.beginPath();
      path.moveTo(0, 320);
      path.lineTo(960, 280);
      path.lineTo(960, 420);
      path.lineTo(0, 480);
      path.closePath();
      path.fillPath();

      // Placeholder Player (Asul na bilog habang wala pang sprite)
      player = this.add.circle(200, 380, 20, 0x3498db);
      this.physics.add.existing(player);

      targetX = player.x;
      targetY = player.y;

      // Click-to-move feature katulad ng AQW
      this.input.on('pointerdown', function (pointer) {
        targetX = pointer.x;
        targetY = pointer.y;
        this.physics.moveTo(player, targetX, targetY, 200);
        isMoving = true;
      }, this);
    }

    function update() {
      // Pagtigil sa character kapag nakatapat na sa diniklikang spot
      if (isMoving) {
        const distance = Phaser.Math.Distance.Between(player.x, player.y, targetX, targetY);
        if (distance < 5) {
          player.body.reset(targetX, targetY);
          isMoving = false;
        }
      }
    }

    // --- UI EVENT FUNCTIONS ---
    function useSkill(num) {
      const chatLog = document.getElementById('chat-log');
      chatLog.innerHTML += `<div>Ginamit ang Skill ${num}!</div>`;
      chatLog.scrollTop = chatLog.scrollHeight;
    }
  </script>
</body>
</html>
