<!DOCTYPE html>
<html lang="tl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AQW Replica Game</title>
  <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      font-family: Arial, sans-serif;
    }

    body {
      background-color: #050505;
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    #game-wrapper {
      position: relative;
      width: 960px;
      height: 550px;
      border: 2px solid #333;
      overflow: hidden;
      background-color: #000;
    }

    /* --- TOP HUD --- */
    .player-profile {
      position: absolute;
      top: 10px;
      left: 10px;
      display: flex;
      align-items: flex-start;
      z-index: 10;
    }

    .portrait-frame {
      position: relative;
      width: 60px;
      height: 60px;
      background: #111;
      border: 2px solid #555;
      border-radius: 50%;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .level-badge {
      position: absolute;
      bottom: 0;
      left: 0;
      background: #000;
      color: #fff;
      border: 1px solid #777;
      border-radius: 50%;
      width: 20px;
      height: 20px;
      font-size: 10px;
      display: flex;
      justify-content: center;
      align-items: center;
      font-weight: bold;
    }

    .stats-container {
      margin-left: 8px;
    }

    .gold-display {
      color: #f1c40f;
      font-size: 12px;
      font-weight: bold;
      margin-bottom: 2px;
    }

    .username {
      font-size: 11px;
      color: #ccc;
      font-weight: bold;
      margin-bottom: 2px;
    }

    .bar-box {
      width: 140px;
      height: 12px;
      background: #222;
      border: 1px solid #444;
      margin-bottom: 2px;
      position: relative;
    }

    .hp-bar { width: 100%; height: 100%; background: #c0392b; }
    .mp-bar { width: 80%; height: 100%; background: #2980b9; }

    .bar-text {
      position: absolute;
      width: 100%;
      text-align: center;
      font-size: 9px;
      top: 0;
      line-height: 12px;
      color: #fff;
      font-weight: bold;
    }

    .class-info {
      font-size: 10px;
      color: #888;
    }

    /* Target Box (Lucy) */
    .target-hud {
      position: absolute;
      top: 80px;
      left: 10px;
      background: rgba(0, 0, 0, 0.7);
      border: 1px solid #444;
      padding: 4px 8px;
      font-size: 11px;
      border-radius: 4px;
      z-index: 10;
    }

    /* --- BOTTOM INTERFACE BAR (AQW STYLE) --- */
    .bottom-bar {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 45px;
      background: #111;
      border-top: 2px solid #333;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 10px;
      z-index: 10;
    }

    .chat-controls {
      display: flex;
      align-items: center;
      gap: 5px;
      width: 300px;
    }

    .chat-input-field {
      width: 200px;
      background: #000;
      border: 1px solid #444;
      color: #fff;
      padding: 3px 6px;
      font-size: 11px;
    }

    .send-btn {
      background: #d35400;
      border: 1px solid #e67e22;
      color: #fff;
      font-size: 10px;
      padding: 3px 8px;
      cursor: pointer;
      font-weight: bold;
    }

    .skills-container {
      display: flex;
      gap: 4px;
    }

    .skill-slot {
      width: 32px;
      height: 32px;
      background: #222;
      border: 1px solid #555;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 11px;
      font-weight: bold;
      color: #aaa;
      position: relative;
    }

    .menu-icons {
      display: flex;
      gap: 8px;
    }

    .icon-btn {
      width: 24px;
      height: 24px;
      background: #333;
      border: 1px solid #666;
      border-radius: 3px;
      cursor: pointer;
    }

    .room-info {
      position: absolute;
      bottom: 50px;
      right: 10px;
      font-size: 11px;
      color: #fff;
      text-shadow: 1px 1px 2px #000;
      z-index: 10;
    }
  </style>
</head>
<body>

<div id="game-wrapper">
  <!-- Top Left HUD -->
  <div class="player-profile">
    <div class="portrait-frame">
      <span style="font-size:20px;">🧔</span>
      <div class="level-badge">69</div>
    </div>
    <div class="stats-container">
      <div class="gold-display">🟡 174457</div>
      <div class="username">MR JELLYBEAN</div>
      <div class="bar-box">
        <div class="hp-bar"></div>
        <div class="bar-text">12603</div>
      </div>
      <div class="bar-box">
        <div class="mp-bar"></div>
        <div class="bar-text">2251</div>
      </div>
      <div class="class-info">Alpha Pirate, Rank 10</div>
    </div>
  </div>

  <!-- Target HUD -->
  <div class="target-hud">
    <strong>Lucy</strong><br>
    <span style="color:#888;">Out of range</span>
  </div>

  <!-- Room Info -->
  <div class="room-info">
    1 player in <span style="color:#f1c40f;">fireforest-92069</span>
  </div>

  <!-- Phaser Canvas -->
  <div id="phaser-container"></div>

  <!-- Bottom Bar -->
  <div class="bottom-bar">
    <div class="chat-controls">
      <input type="text" class="chat-input-field" placeholder="">
      <button class="send-btn">SEND</button>
    </div>

    <div class="skills-container">
      <div class="skill-slot">1</div>
      <div class="skill-slot">2</div>
      <div class="skill-slot">3</div>
      <div class="skill-slot">4</div>
      <div class="skill-slot">5</div>
      <div class="skill-slot">6</div>
    </div>

    <div class="menu-icons">
      <div class="icon-btn" title="Inventory">🎒</div>
      <div class="icon-btn" title="Map">🗺️</div>
      <div class="icon-btn" title="House">🏠</div>
      <div class="icon-btn" title="Settings">⚙️</div>
    </div>
  </div>
</div>

<script>
  const config = {
    type: Phaser.AUTO,
    width: 960,
    height: 550,
    parent: 'phaser-container',
    physics: { default: 'arcade' },
    scene: { preload: preload, create: create, update: update }
  };

  const game = new Phaser.Game(config);
  let player, targetX, targetY, isMoving = false;

  function preload() {
    // PAALALA: Palitan ang mga URLs na ito kapag na-upload mo na ang iyong mga larawan/sprites sa GitHub Assets folder.
    this.load.image('bg_forest', 'https://labs.phaser.io/assets/skies/space3.png'); 
  }

  function create() {
    // 1. Background image (Gubat)
    this.add.rectangle(480, 275, 960, 550, 0x1b4332); 

    // 2. Kalsada o Daanan (Path)
    const path = this.add.graphics();
    path.fillStyle(0x7f5539, 1);
    path.beginPath();
    path.moveTo(480, 200);
    path.lineTo(520, 200);
    path.lineTo(750, 500);
    path.lineTo(250, 500);
    path.closePath();
    path.fillPath();

    // 3. Yellow Arrow sa dulo ng kalsada para mag-move sa susunod na room
    const arrow = this.add.triangle(500, 210, 0, 15, 10, 0, 20, 15, 0xf1c40f);

    // 4. Player Object (MR JELLYBEAN)
    player = this.add.container(550, 400);
    const body = this.add.rectangle(0, 0, 25, 50, 0x333333);
    const nameTag = this.add.text(-35, -45, 'MR JELLYBEAN\n< PAIN >', { font: '10px Arial', fill: '#00ffff', align: 'center' });
    player.add([body, nameTag]);

    this.physics.add.existing(player);

    targetX = player.x;
    targetY = player.y;

    // Click-to-Move Handler
    this.input.on('pointerdown', function (pointer) {
      if (pointer.y < 505) { // Huwag maglakad kapag sa bottom UI na-click
        targetX = pointer.x;
        targetY = pointer.y;
        this.physics.moveTo(player, targetX, targetY, 180);
        isMoving = true;
      }
    }, this);
  }

  function update() {
    if (isMoving) {
      const distance = Phaser.Math.Distance.Between(player.x, player.y, targetX, targetY);
      if (distance < 5) {
        player.body.reset(targetX, targetY);
        isMoving = false;
      }
    }
  }
</script>
</body>
</html>
