<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Novarise World - AQW Real Sprint Animation</title>

<style>
*{ box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
html, body{ width:100%; height:100%; overflow:hidden; background:#111; font-family:Arial,Helvetica,sans-serif; }
#world{ position:fixed; inset:0; overflow:hidden; background:#111; }
#map{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover; user-select:none; pointer-events:none; }
#gameLayer{ position:absolute; inset:0; overflow:hidden; }

/* PLAYER CONTAINER */
#player{ position:absolute; left:50%; top:68%; width:120px; height:150px; transform: translate(-50%,-100%); z-index:20; pointer-events:none; }
#playerSprite{ position:absolute; left:50%; bottom:0; width:100%; height:100%; transform: translateX(-50%); background-image: url("assets/player/idle.png"); background-repeat:no-repeat; background-position:center bottom; background-size:contain; filter: drop-shadow(0 8px 6px rgba(0,0,0,.55)); }

/* AQW VECTOR CHARACTER */
#playerFallback{ position:absolute; left:50%; bottom:0; width:105px; height:145px; transform: translateX(-50%); display:flex; flex-direction:column; align-items:center; filter: drop-shadow(0 7px 5px rgba(0,0,0,.65)); }
.aqw-avatar { width: 100%; height: 100%; transform-origin: bottom center; }
.fallback-name{ position:absolute; left:50%; top:-22px; transform:translateX(-50%); color:white; white-space:nowrap; font-size:15px; font-weight:800; text-shadow: 0 2px 3px #000, 0 0 5px #000; }

/* ======================================================
   REAL AQW SPRINT / RUNNING ANIMATION
====================================================== */

/* Pag-harap sa kaliwa */
#playerFallback.face-left .aqw-avatar { transform: scaleX(-1); }

/* IDLE STATE: Mabilis at natural na paghinga */
#playerFallback:not(.running) .aqw-avatar {
    animation: aqwIdleBreath 2s infinite alternate ease-in-out;
}
@keyframes aqwIdleBreath {
    0% { transform: translateY(0); }
    100% { transform: translateY(-3px); }
}

/* RUNNING STATE 1: Yumuyuko ang buong katawan at nagbo-bounce */
#playerFallback.running .aqw-avatar {
    animation: aqwRealRun 0.28s infinite alternate ease-in-out;
}
@keyframes aqwRealRun {
    0% { transform: translateY(0) rotate(10deg); }
    100% { transform: translateY(-8px) rotate(14deg); }
}

/* RUNNING STATE 2: Kaliwang Binti (Malaking Hakbang Pabalik at Paharap) */
#playerFallback.running .leg-left {
    animation: runLegLeftFull 0.28s infinite alternate ease-in-out;
    transform-origin: 52px 115px;
}
@keyframes runLegLeftFull {
    0% { transform: rotate(-55deg) translateY(-2px); }
    100% { transform: rotate(45deg) translateY(0); }
}

/* RUNNING STATE 3: Kanang Binti (Kabaligtaran ng Kaliwang Binti) */
#playerFallback.running .leg-right {
    animation: runLegRightFull 0.28s infinite alternate ease-in-out;
    transform-origin: 68px 115px;
}
@keyframes runLegRightFull {
    0% { transform: rotate(50deg) translateY(0); }
    100% { transform: rotate(-50deg) translateY(-2px); }
}

/* RUNNING STATE 4: Kaliwang Braso (Kaway at Pag-ayaw sa Hangin) */
#playerFallback.running .arm-left {
    animation: runArmLeftFull 0.28s infinite alternate ease-in-out;
    transform-origin: 44px 68px;
}
@keyframes runArmLeftFull {
    0% { transform: rotate(45deg); }
    100% { transform: rotate(-55deg); }
}

/* RUNNING STATE 5: Kanang Braso at Sandata (Ayon sa pagtakbo) */
#playerFallback.running .arm-right-weapon {
    animation: runArmWeaponFull 0.28s infinite alternate ease-in-out;
    transform-origin: 74px 68px;
}
@keyframes runArmWeaponFull {
    0% { transform: rotate(-25deg) translateY(2px); }
    100% { transform: rotate(20deg) translateY(-4px); }
}

/* RUNNING STATE 6: Cape / Kapa na sumasayaw sa hangin */
#playerFallback.running .cape {
    animation: runCapeFly 0.28s infinite alternate ease-in-out;
    transform-origin: top center;
}
@keyframes runCapeFly {
    0% { transform: rotate(-15deg) skewX(-15deg) scaleY(0.9); }
    100% { transform: rotate(-35deg) skewX(-25deg) scaleY(1.1); }
}

/* UI / HUD Styles */
.world-object{ position:absolute; transform: translate(-50%,-100%); z-index:15; pointer-events:auto; }
.npc{ left:24%; top:70%; width:100px; height:155px; }
.npc-sprite{ width:100%; height:100%; background: url("assets/npcs/quest-npc.png") center bottom / contain no-repeat; }
.object-name{ position:absolute; left:50%; top:-28px; transform:translateX(-50%); color:white; font-size:15px; font-weight:800; white-space:nowrap; text-shadow: 0 2px 3px #000; }
.quest-mark{ position:absolute; left:50%; top:-75px; transform:translateX(-50%); width:38px; height:38px; display:flex; align-items:center; justify-content:center; border-radius:50%; background:#ef2020; border:3px solid white; color:#ffe600; font-size:23px; font-weight:900; box-shadow: 0 0 10px rgba(255,0,0,.65); animation: questPulse 1s infinite alternate; }
@keyframes questPulse{ from{ transform: translateX(-50%) scale(.9); } to{ transform: translateX(-50%) scale(1.08); } }

.monster{ position:absolute; left:78%; top:73%; width:145px; height:120px; transform: translate(-50%,-100%); z-index:15; }
.monster-sprite{ width:100%; height:100%; background: url("assets/monsters/forest-wolf.png") center bottom / contain no-repeat; }
.monster-name{ position:absolute; left:50%; top:-32px; transform:translateX(-50%); color:white; white-space:nowrap; font-weight:800; text-shadow: 0 2px 3px #000; }
.monster-hp{ position:absolute; left:50%; top:-13px; transform:translateX(-50%); width:105px; height:9px; border:1px solid #111; background:#111; }
.monster-hp-fill{ width:100%; height:100%; background:#dc2626; }

.portal{ position:absolute; right:5%; top:62%; width:105px; height:155px; transform: translateY(-100%); z-index:14; background: url("assets/portal.png") center / contain no-repeat; filter: drop-shadow(0 0 16px rgba(0,170,255,.75)); }
.portal-name{ position:absolute; left:50%; top:-25px; transform:translateX(-50%); color:white; font-weight:800; text-shadow: 0 2px 4px #000; }

#moveMarker{ position:absolute; width:32px; height:15px; border-radius:50%; border:2px solid rgba(255,255,255,.85); box-shadow: 0 0 10px rgba(40,140,255,.9); transform: translate(-50%,-50%); z-index:10; pointer-events:none; animation: marker .65s infinite alternate; }
@keyframes marker{ from{ opacity:.35; transform: translate(-50%,-50%) scale(.75); } to{ opacity:1; transform: translate(-50%,-50%) scale(1); } }

.player-hud{ position:fixed; left:12px; top:12px; z-index:50; width:330px; padding:10px; display:flex; gap:10px; border: 2px solid #80652e; border-radius:16px; background: rgba(8,13,19,.93); box-shadow: 0 7px 22px rgba(0,0,0,.45); }
.avatar{ width:66px; height:66px; flex:none; border-radius:50%; border:2px solid #c69c42; background: linear-gradient(#111827,#05070a); display:flex; align-items:center; justify-content:center; color:white; font-size:25px; }
.hud-info{ flex:1; }
.hud-name{ display:flex; justify-content:space-between; color:white; font-size:18px; font-weight:800; margin-bottom:6px; }
.hud-level{ color:#ffd34d; }
.stat-bar{ position:relative; height:15px; overflow:hidden; margin-bottom:5px; border-radius:8px; background:#111827; border:1px solid #111; }
.stat-fill{ height:100%; width:100%; }
.hp-fill{ background: linear-gradient(90deg, #991b1b, #ef4444); }
.mp-fill{ background: linear-gradient(90deg, #1d4ed8, #38bdf8); }
.stat-text{ position:absolute; inset:0; display:flex; align-items:center; justify-content:center; color:white; font-size:10px; font-weight:bold; text-shadow: 0 1px 2px #000; }

.location{ position:fixed; top:12px; right:12px; z-index:50; min-width:270px; padding:10px 18px; text-align:center; border: 2px solid #80652e; border-radius:16px; background: rgba(8,13,19,.93); color:white; }
.location-title{ font-size:17px; font-weight:800; }
.location-time{ margin-top:3px; color:#e6d28e; font-size:12px; }

.quest-panel{ position:fixed; left:10px; top:115px; z-index:50; width:180px; padding:9px 12px; border-radius:10px; background: rgba(5,10,15,.9); border: 1px solid #555; color:white; }
.quest-panel strong{ font-size:16px; }
.quest-status{ margin-top:3px; color:#bfc5cc; font-size:13px; }

.chat{ position:fixed; left:12px; bottom:12px; z-index:50; width:430px; height:175px; overflow:hidden; border: 2px solid #725a2e; border-radius:12px; background: rgba(5,9,14,.95); box-shadow: 0 7px 25px rgba(0,0,0,.5); }
.chat-tabs{ display:flex; height:35px; background:#151b24; }
.chat-tab{ padding:8px 20px; color:#b8bec7; font-size:13px; font-weight:bold; }
.chat-tab.active{ color:white; background:#1760c8; }
.chat-messages{ height:93px; padding:8px 12px; overflow:auto; color:#d9e0e8; font-size:12px; }
.chat-welcome{ color:#ffe000; font-weight:bold; }
.chat-location{ margin-top:5px; color:#20d8ff; }
.chat-input{ display:flex; height:45px; border-top: 1px solid #303640; }
.chat-input input{ flex:1; min-width:0; border:0; outline:0; padding:0 12px; color:white; background:#0b1118; }
.chat-input button{ width:70px; border:0; color:white; font-weight:800; background:#df901c; cursor:pointer; }

.skill-bar{ position:fixed; left:50%; bottom:12px; transform:translateX(-50%); z-index:50; display:flex; gap:7px; padding:8px 12px; border: 2px solid #725a2e; border-radius:17px; background: rgba(7,11,16,.96); box-shadow: 0 7px 25px rgba(0,0,0,.5); }
.skill{ position:relative; width:53px; height:53px; display:flex; align-items:center; justify-content:center; border: 2px solid #596474; border-radius:10px; background: linear-gradient(135deg, #1e2937, #080c11); color:white; font-size:24px; cursor:pointer; }
.skill:hover{ border-color:#facc15; }
.skill-number{ position:absolute; right:4px; bottom:2px; color:white; font-size:10px; }

.menu{ position:fixed; right:12px; bottom:12px; z-index:50; display:flex; gap:10px; padding:8px 12px; border: 2px solid #725a2e; border-radius:17px; background: rgba(7,11,16,.96); }
.menu-item{ width:62px; text-align:center; color:white; font-size:10px; cursor:pointer; text-decoration:none; }
.menu-icon{ width:38px; height:38px; margin:auto auto 3px; display:flex; align-items:center; justify-content:center; border: 1px solid #6c5b38; border-radius:9px; background:#1a2430; font-size:19px; }

@media(max-width:900px){
    .player-hud{ width:250px; top:7px; left:7px; }
    .avatar{ width:50px; height:50px; }
    .hud-name{ font-size:14px; }
    .location{ top:7px; right:7px; min-width:150px; padding:7px; }
    .location-title{ font-size:12px; }
    .quest-panel{ top:82px; left:7px; width:150px; }
    .chat{ left:8px; right:8px; bottom:73px; width:auto; height:130px; }
    .skill-bar{ left:auto; right:8px; bottom:8px; transform:none; }
    .skill{ width:43px; height:43px; font-size:19px; }
    .menu{ display:none; }
    #player{ width:95px; height:125px; }
}
</style>
</head>

<body>

<div id="world">
    <img id="map" src="novarise-forest.png" alt="Novarise Forest">

    <div id="gameLayer">
        <!-- PLAYER -->
        <div id="player">
            <div id="playerSprite"></div>

            <!-- AQW Fully Animated Vector Avatar -->
            <div id="playerFallback">
                <div class="fallback-name">LQS</div>

                <svg class="aqw-avatar" viewBox="0 0 120 180" xmlns="http://www.w3.org/2000/svg">
                    <ellipse cx="60" cy="172" rx="35" ry="6" fill="rgba(0,0,0,0.6)" />

                    <!-- Cape -->
                    <path class="cape" d="M 32 45 L 18 145 L 82 145 L 68 45 Z" fill="#991b1b" />

                    <!-- Left Leg Group -->
                    <g class="leg-left">
                        <path d="M 50 115 L 48 165 L 58 165 L 56 115 Z" fill="#1e293b" />
                        <path d="M 48 150 L 58 150 L 58 168 L 48 168 Z" fill="#0f172a" />
                    </g>

                    <!-- Right Leg Group -->
                    <g class="leg-right">
                        <path d="M 62 115 L 65 165 L 75 165 L 70 115 Z" fill="#334155" />
                        <path d="M 64 150 L 74 150 L 74 168 L 64 168 Z" fill="#ffffff" />
                    </g>

                    <!-- Torso Body -->
                    <path d="M 42 65 Q 60 60 78 65 L 75 120 Q 60 125 45 120 Z" fill="#c084fc" />
                    <path d="M 44 110 Q 60 116 76 110" stroke="#cbd5e1" stroke-width="4" fill="none" />
                    <circle cx="60" cy="113" r="4" fill="#f59e0b" />

                    <!-- Left Arm Group -->
                    <g class="arm-left">
                        <path d="M 44 68 L 32 105" stroke="#c084fc" stroke-width="8" stroke-linecap="round" />
                        <circle cx="30" cy="108" r="4" fill="#cbd5e1" />
                    </g>

                    <!-- Head & Horned Helmet -->
                    <path d="M 50 35 L 70 35 L 68 62 L 52 62 Z" fill="#fbcfe8" />
                    <ellipse cx="60" cy="28" rx="16" ry="18" fill="#fbcfe8" />
                    <path d="M 44 20 Q 60 10 76 20 L 72 55 Q 60 30 48 55 Z" fill="#7f1d1d" />
                    <polygon points="53,26 59,24 57,30" fill="#111" />
                    <polygon points="67,26 61,24 63,30" fill="#111" />

                    <path d="M 45 22 Q 60 8 75 22 L 70 32 Q 60 25 50 32 Z" fill="#7f1d1d" />
                    <path d="M 48 18 Q 32 5 22 18 Q 35 25 46 22 Z" fill="#334155" />
                    <path d="M 45 15 Q 35 8 28 15" stroke="#1e293b" stroke-width="2" fill="none" />
                    <path d="M 72 18 Q 88 5 98 18 Q 85 25 74 22 Z" fill="#334155" />
                    <path d="M 75 15 Q 85 8 92 15" stroke="#1e293b" stroke-width="2" fill="none" />

                    <!-- Right Arm & Staff Weapon Group -->
                    <g class="arm-right-weapon">
                        <line x1="15" y1="150" x2="105" y2="95" stroke="#b45309" stroke-width="5" stroke-linecap="round" />
                        <line x1="15" y1="150" x2="105" y2="95" stroke="#fde047" stroke-width="2" />
                        <circle cx="105" cy="95" r="9" fill="#0284c7" />
                        <circle cx="105" cy="95" r="5" fill="#38bdf8" />

                        <path d="M 74 68 L 95 110" stroke="#c084fc" stroke-width="9" stroke-linecap="round" />
                        <circle cx="97" cy="113" r="5" fill="#111" />
                    </g>
                </svg>
            </div>
        </div>

        <!-- NPC -->
        <div class="world-object npc" id="npc">
            <div class="npc-sprite"></div>
            <div class="object-name">Seraphine</div>
            <div class="quest-mark">!</div>
        </div>

        <!-- MONSTER -->
        <div class="monster" id="monster">
            <div class="monster-sprite"></div>
            <div class="monster-name">Dire Wolf — Lv. 3</div>
            <div class="monster-hp"><div class="monster-hp-fill"></div></div>
        </div>

        <!-- PORTAL -->
        <div class="portal" id="portal">
            <div class="portal-name">Portal</div>
        </div>

        <div id="moveMarker" style="display:none"></div>
    </div>
</div>

<!-- HUD, CHAT, MENU -->
<div class="player-hud">
    <div class="avatar">⚔</div>
    <div class="hud-info">
        <div class="hud-name"><span>LQS</span><span class="hud-level">Lv. 1</span></div>
        <div class="stat-bar"><div class="stat-fill hp-fill"></div><div class="stat-text">100 / 100</div></div>
        <div class="stat-bar"><div class="stat-fill mp-fill"></div><div class="stat-text">100 / 100</div></div>
    </div>
</div>

<div class="location">
    <div class="location-title">☀ Novarise Forest</div>
    <div class="location-time" id="clock">--:--</div>
</div>

<div class="quest-panel">
    <strong>Lucy</strong>
    <div class="quest-status">Out of range</div>
</div>

<div class="chat">
    <div class="chat-tabs">
        <div class="chat-tab active">General</div>
        <div class="chat-tab">Party</div>
        <div class="chat-tab">Guild</div>
    </div>
    <div class="chat-messages" id="chatMessages">
        <div class="chat-welcome">Welcome to Novarise World!</div>
        <div>Type /help for commands.</div>
        <div class="chat-location">You are now in: Novarise Forest</div>
    </div>
    <div class="chat-input">
        <input id="chatInput" type="text" placeholder="Type a message...">
        <button id="sendChat">SEND</button>
    </div>
</div>

<div class="skill-bar">
    <button class="skill">⚔<span class="skill-number">1</span></button>
    <button class="skill">✦<span class="skill-number">2</span></button>
    <button class="skill">🔥<span class="skill-number">3</span></button>
    <button class="skill">🛡<span class="skill-number">4</span></button>
    <button class="skill">🧪<span class="skill-number">5</span></button>
</div>

<div class="menu">
    <a href="character.html" class="menu-item"><div class="menu-icon">🧙</div>Character</a>
    <div class="menu-item"><div class="menu-icon">🎒</div>Inventory</div>
    <div class="menu-item"><div class="menu-icon">🔥</div>Skills</div>
    <div class="menu-item"><div class="menu-icon">❗</div>Quest</div>
    <div class="menu-item"><div class="menu-icon">🗺</div>Map</div>
    <div class="menu-item"><div class="menu-icon">⚙</div>Settings</div>
</div>

<script>
const player = document.getElementById("player");
const playerSprite = document.getElementById("playerSprite");
const fallback = document.getElementById("playerFallback");
const marker = document.getElementById("moveMarker");

function checkSprite(){
    const image = new Image();
    image.src = "assets/player/idle.png";
    image.onload = function(){
        playerSprite.style.display = "block";
        fallback.style.display = "none";
    };
    image.onerror = function(){
        playerSprite.style.display = "none";
        fallback.style.display = "flex";
    };
}
checkSprite();

let playerX = 50, playerY = 68;
let targetX = 50, targetY = 68;
let moving = false;

function updatePlayerPosition(){
    player.style.left = playerX + "%";
    player.style.top = playerY + "%";
}

document.getElementById("gameLayer").addEventListener("click", function(event){
    if(event.target.closest(".world-object,.monster,.portal")) return;
    const rect = this.getBoundingClientRect();
    targetX = ((event.clientX - rect.left) / rect.width) * 100;
    targetY = ((event.clientY - rect.top) / rect.height) * 100;

    if(targetX < playerX) {
        fallback.classList.add("face-left");
    } else {
        fallback.classList.remove("face-left");
    }

    targetX = Math.max(5, Math.min(95, targetX));
    targetY = Math.max(25, Math.min(87, targetY));
    moving = true;
    showMarker(event.clientX, event.clientY);
    startWalking();
});

function movementLoop(){
    if(moving){
        const dx = targetX - playerX;
        const dy = targetY - playerY;
        const distance = Math.sqrt(dx * dx + dy * dy);
        if(distance < .35){
            playerX = targetX; playerY = targetY;
            moving = false;
            stopWalking();
        } else {
            const speed = .35;
            playerX += (dx / distance) * speed;
            playerY += (dy / distance) * speed;
        }
        updatePlayerPosition();
    }
    requestAnimationFrame(movementLoop);
}
movementLoop();

function startWalking(){ fallback.classList.add("running"); }
function stopWalking(){ fallback.classList.remove("running"); }

function showMarker(x,y){
    marker.style.left = x + "px";
    marker.style.top = y + "px";
    marker.style.display = "block";
    clearTimeout(marker.timer);
    marker.timer = setTimeout(function(){ marker.style.display = "none"; }, 700);
}

const keys = {};
window.addEventListener("keydown", (e) => keys[e.key.toLowerCase()] = true);
window.addEventListener("keyup", (e) => keys[e.key.toLowerCase()] = false);

function keyboardMovement(){
    let dx = 0, dy = 0;
    if(keys["w"] || keys["arrowup"]) dy = -1;
    if(keys["s"] || keys["arrowdown"]) dy = 1;
    if(keys["a"] || keys["arrowleft"]) { dx = -1; fallback.classList.add("face-left"); }
    if(keys["d"] || keys["arrowright"]) { dx = 1; fallback.classList.remove("face-left"); }
    if(dx === 0 && dy === 0) return;

    const length = Math.sqrt(dx*dx + dy*dy);
    dx /= length; dy /= length;
    playerX += dx * .45; playerY += dy * .45;
    playerX = Math.max(5, Math.min(95, playerX));
    playerY = Math.max(25, Math.min(87, playerY));
    targetX = playerX; targetY = playerY;
    moving = true;
    startWalking();
    updatePlayerPosition();
}
setInterval(keyboardMovement, 16);

function updateClock(){
    const now = new Date();
    document.getElementById("clock").textContent = now.toLocaleTimeString([], {hour:"numeric", minute:"2-digit"});
}
setInterval(updateClock, 1000);
updateClock();

function sendChat(){
    const input = document.getElementById("chatInput");
    const message = input.value.trim();
    if(!message) return;
    const messages = document.getElementById("chatMessages");
    const row = document.createElement("div");
    row.style.marginTop = "4px";
    const name = document.createElement("strong");
    name.textContent = "Novarise: ";
    name.style.color = "#60a5fa";
    row.appendChild(name);
    row.appendChild(document.createTextNode(message));
    messages.appendChild(row);
    input.value = "";
    messages.scrollTop = messages.scrollHeight;
}

document.getElementById("sendChat").addEventListener("click", sendChat);
document.getElementById("chatInput").addEventListener("keydown", (e) => { if(e.key === "Enter") sendChat(); });

updatePlayerPosition();
</script>

</body>
</html>
