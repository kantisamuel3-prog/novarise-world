<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Novarise — Fantasy RPG</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#111;color:#fff;font-family:Arial,sans-serif}#scene{position:fixed;inset:0;background-image:url('world.png');background-size:cover;background-position:center center;background-repeat:no-repeat}#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}#toast{position:fixed;left:50%;top:16%;transform:translateX(-50%);display:none;padding:10px 18px;background:#10151eee;border:1px solid #e7c56e;border-radius:9px;color:#ffe58a;font-weight:bold;text-shadow:0 1px 2px #000;box-shadow:0 5px 20px #0008;z-index:10}#status{position:fixed;left:50%;bottom:12px;transform:translateX(-50%);padding:7px 13px;border:1px solid #b7a16d;background:#111d;border-radius:8px;font-size:12px;text-align:center;z-index:5;max-width:90vw}#help{position:fixed;right:12px;top:50%;transform:translateY(-50%);padding:10px 12px;background:#111d;border:1px solid #9c8759;border-radius:8px;font-size:12px;line-height:1.8;z-index:5;max-width:150px}#help b{color:#ffe08a}#touch{display:none;position:fixed;left:10px;bottom:62px;gap:6px;z-index:6}button{background:#20242beF;color:white;border:1px solid #d2b56f;border-radius:8px;padding:12px 15px;font-size:18px;box-shadow:0 3px 8px #0008}#hitbar{position:fixed;left:50%;top:25%;transform:translateX(-50%);display:none;width:min(260px,60vw);background:#111d;border:1px solid #7b6045;border-radius:6px;padding:5px;z-index:7;text-align:center;font-size:12px}#hitbar span{display:block;background:linear-gradient(#ff7777,#a60000);height:8px;width:100%;margin-top:4px;transition:width .15s}
@media(max-width:700px){#touch{display:flex}#help{right:5px;top:auto;bottom:120px;transform:none;font-size:10px;padding:7px;max-width:112px}#status{font-size:10px;bottom:7px}#scene{background-position:center center}}
</style></head>
<body>
<div id="scene" aria-label="Fantasy kingdom game background"></div><canvas id="fx"></canvas>
<div id="toast"></div><div id="hitbar">Forest Goblin <span id="enemyHp"></span></div>
<div id="help"><b>CONTROLS</b><br>Move: <b>A / D</b> or ← →<br>Attack: <b>J</b><br>Skill: <b>K</b><br>Jump: <b>W / Space</b><br><small>Click the game to focus</small></div>
<div id="touch"><button id="tl">◀</button><button id="tj">⬆</button><button id="ta">⚔</button><button id="tr">▶</button></div>
<div id="status">Novarise RPG Prototype · Move with A/D · Press J to attack a goblin</div>
<script>
const canvas=document.getElementById('fx'),ctx=canvas.getContext('2d');let W=innerWidth,H=innerHeight,dpr=Math.min(devicePixelRatio||1,2);function resize(){W=innerWidth;H=innerHeight;canvas.width=W*dpr;canvas.height=H*dpr;canvas.style.width=W+'px';canvas.style.height=H+'px';ctx.setTransform(dpr,0,0,dpr,0,0)}addEventListener('resize',resize);resize();
const keys={};let player={x:.50,y:.70,face:1,jump:0},slash=0,skill=0,toastTimer=0,hp=100,attacks=0,defeated=0;let particles=[],floaters=[];
function say(t){const e=document.getElementById('toast');e.textContent=t;e.style.display='block';clearTimeout(toastTimer);toastTimer=setTimeout(()=>e.style.display='none',1500)}
function resizePlayerX(){player.x=Math.max(.15,Math.min(.86,player.x))}
addEventListener('keydown',e=>{const k=e.key.toLowerCase();keys[k]=true;if([' ','arrowleft','arrowright','arrowup'].includes(k))e.preventDefault();if(k==='j'&&!e.repeat)attack(false);if(k==='k'&&!e.repeat)attack(true)});addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);canvas.tabIndex=0;
function attack(special){attacks++;slash=special?28:18;skill=special?28:0;let damage=special?45:20;hp=Math.max(0,hp-damage);document.getElementById('enemyHp').style.width=hp+'%';document.getElementById('hitbar').style.display='block';let x=W*(player.x+player.face*.11),y=H*(player.y-.07);for(let i=0;i<12;i++){let a=(Math.random()*1.5-.75)+(player.face===1?0:Math.PI);particles.push({x,y,vx:Math.cos(a)*(2+Math.random()*5),vy:Math.sin(a)*(2+Math.random()*5),life:18+Math.random()*12,kind:special?'gold':'slash'})}floaters.push({x,y:y-25,text:'-'+damage,life:45});say(special?'SPECIAL SKILL!':'SWORD ATTACK!');if(hp===0){defeated++;hp=100;document.getElementById('enemyHp').style.width='100%';say('Goblin defeated! '+defeated+' defeated');document.getElementById('status').textContent='Quest progress: '+defeated+' goblin(s) defeated · XP earned: '+(defeated*20)}}
function bind(id,key){let el=document.getElementById(id);const down=e=>{e.preventDefault();keys[key]=true};const up=e=>{e.preventDefault();keys[key]=false};el.addEventListener('touchstart',down,{passive:false});el.addEventListener('touchend',up,{passive:false});el.addEventListener('mousedown',down);el.addEventListener('mouseup',up);el.addEventListener('mouseleave',up)}bind('tl','a');bind('tr','d');bind('tj',' ');document.getElementById('ta').addEventListener('click',()=>attack(false));
function draw(){ctx.clearRect(0,0,W,H);if(keys.a||keys.arrowleft){player.x-=.0035;player.face=-1}if(keys.d||keys.arrowright){player.x+=.0035;player.face=1}resizePlayerX();if((keys.w||keys[' ']||keys.arrowup)&&player.jump===0)player.jump=1;if(player.jump>0){player.jump+=.8;if(player.jump>19)player.jump=0}
// The illustration is the scene artwork. These animated effects provide a lightweight gameplay interaction layer.
if(slash>0){let x=W*(player.x+player.face*.10),y=H*(player.y-.08)-Math.max(0,player.jump)*2;ctx.save();ctx.translate(x,y);ctx.scale(player.face,1);ctx.beginPath();ctx.arc(0,0,48,Math.PI*1.15,Math.PI*1.85);ctx.strokeStyle=skill>0?'#ffe36b':'#d9efff';ctx.lineWidth=skill>0?9:6;ctx.shadowColor=skill>0?'#ffae20':'#fff';ctx.shadowBlur=20;ctx.stroke();ctx.restore();slash--}if(skill>0){let x=W*(player.x+player.face*.12),y=H*(player.y-.08);ctx.beginPath();ctx.arc(x,y,70+(28-skill)*2,0,Math.PI*2);ctx.strokeStyle='rgba(255,205,70,'+(skill/35)+')';ctx.lineWidth=5;ctx.stroke();skill--}
particles=particles.filter(p=>p.life>0);for(const p of particles){ctx.fillStyle=p.kind==='gold'?'#ffdf69':'#eaf7ff';ctx.globalAlpha=Math.min(1,p.life/15);ctx.beginPath();ctx.arc(p.x,p.y,3,0,Math.PI*2);ctx.fill();p.x+=p.vx;p.y+=p.vy;p.life--}ctx.globalAlpha=1;floaters=floaters.filter(f=>f.life>0);for(const f of floaters){ctx.globalAlpha=Math.min(1,f.life/15);ctx.fillStyle='#ffe05a';ctx.font='bold 24px Arial';ctx.textAlign='center';ctx.shadowColor='#000';ctx.shadowBlur=4;ctx.fillText(f.text,f.x,f.y-(45-f.life)*1.2);f.life--}ctx.globalAlpha=1;ctx.shadowBlur=0;requestAnimationFrame(draw)}draw();
</script></body></html>
